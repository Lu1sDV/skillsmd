---
# php sink rules — merged pack (one file per technology).
#
# Sources merged (dedup by rule id; on collision the richer definition wins):
#   - php-security-mega-pack.yaml  (38 rules)
#   - php-gap-sinks.yaml  (39 rules)
#   - php-additional-sinks.yaml  (366 rules)
# Total: 439 rules
#
# Mirror rule: `references/sinks/php.md` is the human catalog for this pack —
# edit both together (doc = context/taxonomy, this file = executable detectors).
#
# Repairs applied at merge time (every repaired rule was re-verified to parse AND fire):
#   bare `$$$` arg lists        -> `(...)` / `, ...)`
#   unterminated statements    -> `;` appended
#   multi-statement sequences  -> `...` inserted between statements
#   `f(... X ...)` args        -> `f(..., X, ...)`
#   `<hdr> { ... X ... }`      -> pattern-inside + pattern
#   PHP text-shaped rules      -> pattern-regex (TEXTUAL)
#
# Repaired but NOT fire-verified against a sample (parse-valid only, 8 rules) —
# these may be inert; treat their hits as unconfirmed until exercised:
#   php-auth-jwt-none-algorithm
#   php-crypto-aes-custom-implementation
#   php-fileread-spl-file-object-foreach-tainted
#   php-infodisclosure-database-error-display
#   php-infodisclosure-exception-stack-trace
#   php-infodisclosure-server-env-leak
#   php-openredirect-cakephp-redirect-tainted
#   php-openredirect-zend-redirect-tainted
#
# Dropped rules (no expressible semgrep pattern):
#   php-obfus-variable-function-call — semgrep PHP cannot express variable function calls (`$_()`)
#   php-typejuggling-switch-loose-comparison — semgrep PHP cannot parse `switch` statement patterns
#
# Validate: semgrep --validate --config <this file>

rules:
  - id: php-rce-direct-command-exec
    languages: [php]
    severity: ERROR
    message: >-
      Direct command execution with user-controlled input. Tainted data reaches
      a shell sink — verify the argument is shell-escaped (escapeshellarg /
      escapeshellcmd) and that the command itself is constant. See
      references/sinks/php.md § RCE Sinks.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      vuln-research-domain: command-injection
      confidence: HIGH
    pattern-either:
      - pattern: system($X, ...)
      - pattern: exec($X, ...)
      - pattern: passthru($X, ...)
      - pattern: shell_exec($X)
      - pattern: popen($X, ...)
      - pattern: proc_open($X, ...)
      - pattern: pcntl_exec($X, ...)
    pattern-not-either:
      - pattern: system("...", ...)
      - pattern: exec("...", ...)
      - pattern: passthru("...", ...)
      - pattern: shell_exec("...")
      - pattern: popen("...", ...)
      - pattern: proc_open("...", ...)
      - pattern: system(escapeshellcmd(...), ...)
      - pattern: exec(escapeshellcmd(...), ...)
      - pattern: shell_exec(escapeshellcmd(...))
      - pattern: system(escapeshellarg(...), ...)
      - pattern: exec(escapeshellarg(...), ...)
      - pattern: shell_exec(escapeshellarg(...))


  - id: php-rce-backtick-operator
    languages: [php]
    severity: ERROR
    message: >-
      Backtick operator executes a shell command. Any interpolated variable
      becomes a command-injection sink. Replace with a constant command +
      escapeshellarg() for arguments.
    metadata:
      category: security
      cwe: "CWE-78"
      vuln-research-domain: command-injection
      confidence: HIGH
    pattern-regex: '`[^`]*\$[A-Za-z_][^`]*`'
    paths:
      include: ["*.php", "*.phtml", "*.inc"]


  # ---------------------------------------------------------------------------
  # RCE — code-evaluation sinks
  # ---------------------------------------------------------------------------
  - id: php-rce-eval-with-variable
    languages: [php]
    severity: ERROR
    message: >-
      eval() on a non-literal argument is direct PHP code execution. If any
      part of the string is attacker-controlled this is RCE.
    metadata:
      category: security
      cwe: "CWE-95: Eval Injection"
      vuln-research-domain: code-injection
      confidence: HIGH
    pattern-either:
      - pattern: eval($X)
    pattern-not: eval("...")


  - id: php-rce-assert-string-arg
    languages: [php]
    severity: ERROR
    message: >-
      assert() evaluates string arguments as PHP code on PHP < 8.0. With a
      tainted string this is RCE. Use a real assertion library or upgrade.
    metadata:
      category: security
      cwe: "CWE-95"
      vuln-research-domain: code-injection
      php-version: "<8.0"
      confidence: HIGH
    pattern-either:
      - pattern: assert($X)
    pattern-not-either:
      - pattern: assert(true)
      - pattern: assert(false)
      - pattern: assert($X === $Y)
      - pattern: assert($X == $Y)
      - pattern: assert($X !== $Y)
      - pattern: assert($X != $Y)
      - pattern: assert(is_$F(...))


  - id: php-rce-preg-replace-e-modifier
    languages: [php]
    severity: ERROR
    message: >-
      preg_replace() with the /e modifier evaluates the replacement as PHP
      code. Removed in PHP 7 but still present in legacy code. Replace with
      preg_replace_callback().
    metadata:
      category: security
      cwe: "CWE-95"
      vuln-research-domain: code-injection
      php-version: "<7.0"
      confidence: HIGH
    pattern-regex: 'preg_replace\s*\(\s*["''][^"'']*\/[a-zA-Z]*e[a-zA-Z]*["'']'


  - id: php-rce-create-function
    languages: [php]
    severity: ERROR
    message: >-
      create_function() compiles its body string as PHP code at runtime. With
      any user-controlled component this is RCE. Deprecated in PHP 7.2,
      removed in 8.0 — replace with a closure.
    metadata:
      category: security
      cwe: "CWE-95"
      vuln-research-domain: code-injection
      confidence: HIGH
    pattern: create_function(...)


  # ---------------------------------------------------------------------------
  # RCE — callback sinks (call_user_func family + array_* + handler registration)
  # ---------------------------------------------------------------------------
  - id: php-rce-call-user-func-tainted-callable
    languages: [php]
    severity: ERROR
    message: >-
      call_user_func[_array]() with a non-literal callable executes whatever
      function the attacker names. Even if the *data* arg is constant, an
      attacker-controlled callable string == RCE / phpinfo / system invocation.
      See references/sinks/php.md § Extended callback sinks.
    metadata:
      category: security
      cwe: "CWE-94: Code Injection"
      vuln-research-domain: code-injection
      confidence: HIGH
    pattern-either:
      - pattern: call_user_func($F, ...)
      - pattern: call_user_func_array($F, ...)
    pattern-not-either:
      - pattern: call_user_func("...", ...)
      - pattern: call_user_func_array("...", ...)
      - pattern: call_user_func([..., "..."], ...)
      - pattern: call_user_func_array([..., "..."], ...)
      - pattern: call_user_func(function(...) { ... }, ...)
      - pattern: call_user_func_array(function(...) { ... }, ...)


  - id: php-rce-array-callback-tainted
    languages: [php]
    severity: WARNING
    message: >-
      array_map / array_filter / array_walk / usort family with a non-literal
      callback. If the callable comes from user input it is RCE. Callback
      argument positions are catalogued in references/sinks/php.md.
    metadata:
      category: security
      cwe: "CWE-94"
      vuln-research-domain: code-injection
      confidence: MEDIUM
    pattern-either:
      - pattern: array_map($F, ...)
      - pattern: array_filter(..., $F)
      - pattern: array_walk(..., $F, ...)
      - pattern: array_walk_recursive(..., $F, ...)
      - pattern: array_reduce(..., $F, ...)
      - pattern: usort(..., $F)
      - pattern: uasort(..., $F)
      - pattern: uksort(..., $F)
      - pattern: preg_replace_callback("...", $F, ...)
      - pattern: iterator_apply(..., $F, ...)
    pattern-not-either:
      - pattern: array_map(function(...) { ... }, ...)
      - pattern: array_map(fn(...) => ..., ...)
      - pattern: array_filter(..., function(...) { ... })
      - pattern: usort(..., function(...) { ... })


  - id: php-rce-handler-registration-tainted
    languages: [php]
    severity: ERROR
    message: >-
      Registering a tainted callable as an error/shutdown/autoload handler
      gives the attacker code execution at handler-fire time.
    metadata:
      category: security
      cwe: "CWE-94"
      vuln-research-domain: code-injection
      confidence: HIGH
    pattern-either:
      - pattern: register_shutdown_function($F, ...)
      - pattern: register_tick_function($F, ...)
      - pattern: set_error_handler($F, ...)
      - pattern: set_exception_handler($F)
      - pattern: spl_autoload_register($F, ...)
      - pattern: ob_start($F, ...)
      - pattern: stream_filter_register("...", $F)
      - pattern: session_set_save_handler($F, ...)
    pattern-not-either:
      - pattern: register_shutdown_function("...", ...)
      - pattern: set_error_handler("...", ...)
      - pattern: set_exception_handler("...")
      - pattern: spl_autoload_register("...", ...)
      - pattern: register_shutdown_function(function(...) { ... }, ...)
      - pattern: set_error_handler(function(...) { ... }, ...)
      - pattern: spl_autoload_register(function(...) { ... }, ...)
      - pattern: register_shutdown_function([..., "..."], ...)
      - pattern: set_error_handler([..., "..."], ...)


  # ---------------------------------------------------------------------------
  # LFI / RFI — dynamic include/require + stream wrappers
  # ---------------------------------------------------------------------------
  - id: php-lfi-dynamic-include
    languages: [php]
    severity: ERROR
    message: >-
      Dynamic include/require with non-literal path. With allow_url_include=On
      this is RFI → RCE. Without it, attackers chain stream wrappers
      (php://input, data://, expect://, zip://, phar://) or use a file-write
      sink first. Whitelist the allowed pages instead.
    metadata:
      category: security
      cwe: "CWE-98: PHP Remote File Inclusion"
      vuln-research-domain: file-inclusion
      confidence: HIGH
    pattern-either:
      - pattern: include $X;
      - pattern: include_once $X;
      - pattern: require $X;
      - pattern: require_once $X;
    pattern-not-either:
      - pattern: include "...";
      - pattern: include_once "...";
      - pattern: require "...";
      - pattern: require_once "...";
      - pattern: include __DIR__ . "...";
      - pattern: require __DIR__ . "...";
      - pattern: include_once __DIR__ . "...";
      - pattern: require_once __DIR__ . "...";


  - id: php-stream-wrapper-attacker-reachable
    languages: [php]
    severity: WARNING
    message: >-
      PHP stream-wrapper string detected. If reachable from user input these
      enable LFI→RCE escalation: php://input (POST body as code), data://
      (inline payload), expect:// (RCE via expect ext), phar:// (object
      deserialization), zip:// (entry traversal).
    metadata:
      category: security
      vuln-research-domain: file-inclusion
      cve: "CVE-2024-2961-adjacent"
      confidence: MEDIUM
    pattern-regex: '["''](?:php://input|php://filter|data://|expect://|zip://|phar://|glob://|compress\.zlib://)'
    paths:
      include: ["*.php", "*.phtml", "*.inc"]


  - id: php-iconv-cve-2024-2961-filter
    languages: [php]
    severity: ERROR
    message: >-
      CVE-2024-2961 — php://filter chain to ISO-2022-CN-EXT triggers a glibc
      iconv() heap overflow → arbitrary write → RCE. Elevates EVERY PHP file
      read primitive (file_get_contents/include/readfile/...) from
      disclosure to RCE. No allow_url_include needed. Works PHP 7.0–8.3.
    metadata:
      category: security
      cwe: "CWE-787: Out-of-bounds Write"
      cve: "CVE-2024-2961"
      vuln-research-domain: memory-corruption
      confidence: HIGH
    pattern-regex: '(?:convert\.iconv\.[^"''/]+/?(?:ISO-2022-CN-EXT)|ISO-2022-CN-EXT)'


  # ---------------------------------------------------------------------------
  # Deserialization — unserialize + Phar trigger sinks
  # ---------------------------------------------------------------------------
  - id: php-deserialization-unserialize-user-input
    languages: [php]
    severity: ERROR
    message: >-
      unserialize() on attacker-controlled data triggers magic-method chains
      (__wakeup/__destruct/__toString...) against every loaded class. Use
      json_decode() instead, or restrict allowed_classes.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      vuln-research-domain: object-injection
      confidence: HIGH
    pattern-either:
      - pattern: unserialize($_GET[...], ...)
      - pattern: unserialize($_POST[...], ...)
      - pattern: unserialize($_REQUEST[...], ...)
      - pattern: unserialize($_COOKIE[...], ...)
      - pattern: unserialize(base64_decode($_GET[...]), ...)
      - pattern: unserialize(base64_decode($_POST[...]), ...)
      - pattern: unserialize(base64_decode($_REQUEST[...]), ...)
      - pattern: unserialize(base64_decode($_COOKIE[...]), ...)
      - pattern: unserialize($X)
    pattern-not-either:
      - pattern: unserialize("...")
      - pattern: unserialize($X, ["allowed_classes" => false])
      - pattern: unserialize($X, ["allowed_classes" => []])


  - id: php-phar-deserialization-trigger
    languages: [php]
    severity: WARNING
    message: >-
      Any filesystem function on a user-controlled path triggers Phar
      deserialization when the path starts with "phar://" (PHP < 8.0 default,
      still reachable later via crafted streams). Combine with the Phar
      magic-method chain → RCE. Validate scheme before calling.
    metadata:
      category: security
      cwe: "CWE-502"
      vuln-research-domain: object-injection
      confidence: MEDIUM
    pattern-either:
      - pattern: file_exists($X)
      - pattern: is_file($X)
      - pattern: is_dir($X)
      - pattern: filesize($X)
      - pattern: filemtime($X)
      - pattern: file_get_contents($X)
      - pattern: stat($X)
      - pattern: md5_file($X)
      - pattern: sha1_file($X)
      - pattern: hash_file(..., $X)
      - pattern: getimagesize($X)
      - pattern: exif_read_data($X)
    pattern-not-either:
      - pattern: file_exists("...")
      - pattern: is_file("...")
      - pattern: file_get_contents("...")


  # ---------------------------------------------------------------------------
  # SQLi — raw concat into mysql_*/mysqli/PDO + ORDER BY identifier injection
  # ---------------------------------------------------------------------------
  - id: php-sqli-concat-mysql
    languages: [php]
    severity: ERROR
    message: >-
      String concatenation into a SQL execution sink. Use a prepared statement
      with bound parameters (mysqli::prepare + bind_param, PDO::prepare +
      execute). Even apparent integer inputs must be parameterised — they
      shape ORDER BY / LIMIT clauses too.
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      vuln-research-domain: sql-injection
      owasp: "A03:2021"
      confidence: HIGH
    pattern-either:
      - pattern: mysql_query($A . $B, ...)
      - pattern: mysqli_query($C, $A . $B)
      - pattern: $DB->query($A . $B)
      - pattern: $DB->exec($A . $B)
      - pattern: pg_query($A . $B)
      - pattern: pg_query($C, $A . $B)
      - pattern: sqlite_query($DB, $A . $B)
      - pattern: mysql_query($_GET[...], ...)
      - pattern: mysql_query($_POST[...], ...)
      - pattern: mysqli_query($C, $_GET[...])
      - pattern: mysqli_query($C, $_POST[...])
      - pattern: $DB->query($_GET[...])
      - pattern: $DB->query($_POST[...])
      - pattern: $DB->exec($_GET[...])


  - id: php-sqli-interpolated-string
    languages: [php]
    severity: ERROR
    message: >-
      Variable interpolated directly into a SQL string. Same risk as concat
      SQLi — switch to prepared statements with bound parameters.
    metadata:
      category: security
      cwe: "CWE-89"
      vuln-research-domain: sql-injection
      confidence: HIGH
    pattern-regex: '(?:mysql_query|mysqli_query|->query|->exec|pg_query)\s*\([^)]*"[^"]*\$\{?[A-Za-z_]'


  - id: php-sqli-order-by-direct
    languages: [php]
    severity: WARNING
    message: >-
      ORDER BY / GROUP BY / LIMIT columns cannot be bound by placeholders.
      If a $_GET-controlled value lands there directly, attacker injects SQL
      tail. Whitelist sortable columns to a fixed array first.
    metadata:
      category: security
      cwe: "CWE-89"
      vuln-research-domain: sql-injection
      confidence: MEDIUM
    pattern-regex: '(?:ORDER\s+BY|GROUP\s+BY|LIMIT)\s*[`"'']?\s*\$\{?(?:_GET|_POST|_REQUEST|_COOKIE)'


  # ---------------------------------------------------------------------------
  # XSS — direct echo / print of superglobals
  # ---------------------------------------------------------------------------
  - id: php-xss-echo-superglobal
    languages: [php]
    severity: ERROR
    message: >-
      Direct output of a superglobal without htmlspecialchars() / htmlentities()
      is reflected XSS. Wrap with htmlspecialchars($x, ENT_QUOTES|ENT_HTML5,
      'UTF-8') for the HTML body and context-appropriate encoders for
      attribute / JS / URL / CSS contexts.
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      vuln-research-domain: xss
      owasp: "A03:2021"
      confidence: HIGH
    pattern-either:
      - pattern: echo $_GET[...];
      - pattern: echo $_POST[...];
      - pattern: echo $_REQUEST[...];
      - pattern: echo $_COOKIE[...];
      - pattern: echo $_SERVER[...];
      - pattern: print $_GET[...];
      - pattern: print $_POST[...];
      - pattern: print $_REQUEST[...];
      - pattern: print $_COOKIE[...];
      - pattern: printf("%s", $_GET[...]);
      - pattern: printf("%s", $_POST[...]);
      - pattern: print_r($_GET[...]);
      - pattern: var_dump($_GET[...]);


  - id: php-xss-short-echo-superglobal
    languages: [php]
    severity: ERROR
    message: >-
      <?= $_GET[...] ?> short-echo prints a superglobal directly into the
      response body. Reflected XSS — wrap with htmlspecialchars().
    metadata:
      category: security
      cwe: "CWE-79"
      vuln-research-domain: xss
      confidence: HIGH
    pattern-regex: '<\?=\s*\$(?:_GET|_POST|_REQUEST|_COOKIE|_SERVER)\s*\['


  # ---------------------------------------------------------------------------
  # SSRF — outbound request sinks with user-controlled URL
  # ---------------------------------------------------------------------------
  - id: php-ssrf-curl-user-url
    languages: [php]
    severity: ERROR
    message: >-
      curl_setopt with CURLOPT_URL set from user input. SSRF reaches internal
      services (169.254.169.254 metadata, 127.0.0.1:6379 redis, localhost
      admin). Validate scheme + DNS-resolve against an allow-list, and pin
      CURLOPT_PROTOCOLS to (CURLPROTO_HTTP | CURLPROTO_HTTPS).
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery"
      vuln-research-domain: ssrf
      owasp: "A10:2021"
      confidence: HIGH
    pattern-either:
      - pattern: curl_setopt($CH, CURLOPT_URL, $_GET[...])
      - pattern: curl_setopt($CH, CURLOPT_URL, $_POST[...])
      - pattern: curl_setopt($CH, CURLOPT_URL, $_REQUEST[...])
      - pattern: curl_init($_GET[...])
      - pattern: curl_init($_POST[...])
      - pattern: curl_init($_REQUEST[...])


  - id: php-ssrf-file-get-contents-user-url
    languages: [php]
    severity: WARNING
    message: >-
      file_get_contents() / fopen() / readfile() with user input — SSRF when
      allow_url_fopen=On (PHP default). Also LFI / Phar deserialization.
    metadata:
      category: security
      cwe: "CWE-918"
      vuln-research-domain: ssrf
      confidence: MEDIUM
    pattern-either:
      - pattern: file_get_contents($_GET[...], ...)
      - pattern: file_get_contents($_POST[...], ...)
      - pattern: file_get_contents($_REQUEST[...], ...)
      - pattern: fopen($_GET[...], ...)
      - pattern: fopen($_POST[...], ...)
      - pattern: readfile($_GET[...])
      - pattern: readfile($_POST[...])
      - pattern: get_headers($_GET[...], ...)
      - pattern: copy($_GET[...], ...)
      - pattern: new SoapClient($_GET[...], ...)
      - pattern: new SoapClient($_POST[...], ...)


  # ---------------------------------------------------------------------------
  # XXE — XML parsers without entity hardening
  # ---------------------------------------------------------------------------
  - id: php-xxe-simplexml-load
    languages: [php]
    severity: ERROR
    message: >-
      simplexml_load_string / DOMDocument::loadXML on user input without
      LIBXML_NONET and (PHP < 8.0) libxml_disable_entity_loader(true) is XXE
      — file read, SSRF, DoS. PHP 8+ disabled external entities by default
      but custom doctypes can still hurt; pass LIBXML_NONET | LIBXML_DTDLOAD=0
      explicitly.
    metadata:
      category: security
      cwe: "CWE-611: XXE"
      vuln-research-domain: xxe
      confidence: HIGH
    pattern-either:
      - pattern: simplexml_load_string($X)
      - pattern: simplexml_load_file($X)
      - pattern: $D->loadXML($X)
      - pattern: $D->load($X)
      - pattern: new SimpleXMLElement($X)
      - pattern: XMLReader::xml($X)
    pattern-not-either:
      - pattern: simplexml_load_string($X, ..., LIBXML_NONET)
      - pattern: simplexml_load_string($X, ..., $F)
      - pattern: simplexml_load_file($X, ..., LIBXML_NONET)
      - pattern: $D->loadXML($X, LIBXML_NONET)
      - pattern: $D->load($X, LIBXML_NONET)
      - pattern: new SimpleXMLElement($X, LIBXML_NONET)


  # ---------------------------------------------------------------------------
  # Path traversal — file ops with user input
  # ---------------------------------------------------------------------------
  - id: php-path-traversal-user-input
    languages: [php]
    severity: ERROR
    message: >-
      File operation on a user-controlled path. Attacker reads /etc/passwd,
      env files, app source via "../" sequences. Resolve with realpath() and
      check it starts with an absolute allow-listed prefix.
    metadata:
      category: security
      cwe: "CWE-22: Path Traversal"
      vuln-research-domain: path-traversal
      confidence: HIGH
    pattern-either:
      - pattern: file_get_contents($A . $_GET[...])
      - pattern: file_get_contents($A . $_POST[...])
      - pattern: file_get_contents($A . $_REQUEST[...])
      - pattern: file_get_contents($_GET[...] . $A)
      - pattern: file_get_contents($_POST[...] . $A)
      - pattern: readfile($A . $_GET[...])
      - pattern: readfile($A . $_POST[...])
      - pattern: fopen($A . $_GET[...], ...)
      - pattern: fopen($A . $_POST[...], ...)
      - pattern: include $A . $_GET[...]
      - pattern: include $A . $_POST[...]
      - pattern: require $A . $_GET[...]


  # ---------------------------------------------------------------------------
  # Type juggling / hash comparison traps
  # ---------------------------------------------------------------------------
  - id: php-type-juggling-magic-hash-compare
    languages: [php]
    severity: ERROR
    message: >-
      Loose comparison (==) between a hash function result and a string. PHP
      treats "0e<digits>" as float 0, so any hash with that form == "0".
      Use hash_equals() for timing-safe constant-time comparison.
    metadata:
      category: security
      cwe: "CWE-697: Incorrect Comparison"
      vuln-research-domain: type-juggling
      confidence: HIGH
    pattern-either:
      - pattern: md5($X) == $Y
      - pattern: sha1($X) == $Y
      - pattern: hash(..., $X) == $Y
      - pattern: $X == md5($Y)
      - pattern: $X == sha1($Y)
      - pattern: crypt($X, $Y) == $Z


  - id: php-type-juggling-strcmp-array
    languages: [php]
    severity: ERROR
    message: >-
      strcmp() returns NULL (and emits a warning) when called with an array
      argument; NULL == 0 == "matches". Auth bypass with ?pass[]=1. Use
      hash_equals() or strict typing on the input first.
    metadata:
      category: security
      cwe: "CWE-697"
      vuln-research-domain: type-juggling
      confidence: HIGH
    pattern-either:
      - pattern: strcmp($_GET[...], ...) == 0
      - pattern: strcmp($_POST[...], ...) == 0
      - pattern: strcmp(..., $_GET[...]) == 0
      - pattern: strcmp(..., $_POST[...]) == 0
      - pattern: 0 == strcmp($_GET[...], ...)
      - pattern: '!strcmp($_GET[...], ...)'
      - pattern: '!strcmp($_POST[...], ...)'


  - id: php-type-juggling-in-array-no-strict
    languages: [php]
    severity: WARNING
    message: >-
      in_array() / array_search() without the third strict=true argument uses
      loose comparison — "1abc" matches 1, "0e..." matches 0. Always pass
      true as the third argument.
    metadata:
      category: security
      cwe: "CWE-697"
      vuln-research-domain: type-juggling
      confidence: MEDIUM
    pattern-either:
      - pattern: in_array($_GET[...], $X)
