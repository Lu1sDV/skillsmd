  - id: php-disable-security-ini-set
    languages: [php]
    severity: WARNING
    message: >-
      ini_set() / putenv() flipping a security-relevant flag at runtime.
      Disables disable_functions, open_basedir, allow_url_include, or sets
      LD_PRELOAD. Often the final RCE step in a chain — flag any caller.
    metadata:
