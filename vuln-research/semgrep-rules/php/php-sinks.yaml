      - pattern: ini_set("allow_url_include", ...)
      - pattern: ini_set("allow_url_fopen", ...)
      - pattern: ini_set("safe_mode", ...)
      - pattern: ini_restore(...)
      - pattern: putenv("LD_PRELOAD=...")
      - pattern: putenv($X)
    pattern-not-either:
