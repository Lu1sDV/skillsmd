  - id: php-ziparchive-extractto-no-validation
    languages: [php]
    severity: WARNING
    message: >-
      ZipArchive::extractTo / PharData::extractTo do not validate entry
      paths. A zip entry named "../../shell.php" lands outside the target
      directory. After extraction, walk entries and verify
      realpath($entry) startsWith realpath($target). See
      references/sinks/php.md § Archive Extraction Sinks.
    metadata:
