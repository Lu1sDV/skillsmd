      - pattern: array_search($_POST[...], $X)
    pattern-not-either:
      - pattern: in_array(..., ..., true)
      - pattern: array_search(..., ..., true)


  # ---------------------------------------------------------------------------
  # Weak crypto / weak randomness
  # ---------------------------------------------------------------------------
  - id: php-crypto-md5-sha1-for-password
    languages: [php]
    severity: WARNING
    message: >-
      md5() / sha1() used in a password-shaped context. Both are fast hash
      functions vulnerable to GPU brute force. Use password_hash() with
      PASSWORD_DEFAULT (currently bcrypt; argon2id when available) and verify
      with password_verify().
    metadata:
      category: security
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      vuln-research-domain: crypto
      confidence: MEDIUM
    pattern-either:
      - pattern: $X = md5($PASSWORD)
      - pattern: md5($PASSWORD) === $X
      - pattern: md5($PASSWORD) == $X
      - pattern: $X = sha1($PASSWORD)
      - pattern: sha1($PASSWORD) === $X
      - pattern: sha1($PASSWORD) == $X
    metavariable-regex:
      metavariable: $PASSWORD
      regex: '\$?(?:[Pp]assword|[Pp]asswd|[Pp]wd|[Pp]ass)'


  - id: php-crypto-mcrypt-deprecated
    languages: [php]
    severity: WARNING
    message: >-
      mcrypt_* family is deprecated since PHP 7.1 and removed in 7.2. Defaults
      to ECB mode, zero-padding without authentication. Use OpenSSL with
      AES-GCM or sodium_crypto_secretbox.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      vuln-research-domain: crypto
      confidence: HIGH
    pattern-either:
      - pattern: mcrypt_encrypt(...)
      - pattern: mcrypt_decrypt(...)
      - pattern: mcrypt_create_iv(...)
      - pattern: mcrypt_module_open(...)


  - id: php-crypto-weak-rand-for-token
    languages: [php]
    severity: ERROR
    message: >-
      rand() / mt_rand() / uniqid() are NOT cryptographically secure. Used
      for a token / nonce / session id / password reset key they are
      predictable. Use random_bytes() / random_int() / bin2hex(random_bytes(32)).
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak PRNG"
      vuln-research-domain: crypto
      confidence: HIGH
    pattern-either:
      - pattern: $TOKEN = md5(rand())
      - pattern: $TOKEN = md5(mt_rand())
      - pattern: $TOKEN = md5(uniqid(...))
      - pattern: $TOKEN = sha1(rand())
      - pattern: $TOKEN = sha1(mt_rand())
      - pattern: $TOKEN = sha1(uniqid(...))
      - pattern: $TOKEN = uniqid(...)
      - pattern: $TOKEN = (string) rand(...)
      - pattern: $TOKEN = (string) mt_rand(...)
    metavariable-regex:
      metavariable: $TOKEN
      regex: '\$?(?:[Tt]oken|[Nn]once|[Ss]ession|[Ss]ecret|[Cc]srf|[Rr]eset|[Aa]pi[Kk]ey|[Aa]pi_key)'


  # ---------------------------------------------------------------------------
  # CRLF / header injection / open redirect / mail() abuse
  # ---------------------------------------------------------------------------
  - id: php-crlf-header-user-input
    languages: [php]
    severity: ERROR
    message: >-
      header() with user input. Pre-PHP 5.1.2 raw \r\n landed in the response
      → header injection / response splitting. Modern PHP rejects \r\n but
      single \n in legacy/forked builds still passes. Also: header("Location:")
      without an immediate exit() lets the script continue past the auth gate.
    metadata:
      category: security
      cwe: "CWE-93: CRLF Injection"
      vuln-research-domain: header-injection
      confidence: HIGH
    pattern-either:
      - pattern: 'header("Location: " . $_GET[...])'
      - pattern: 'header("Location: " . $_POST[...])'
      - pattern: 'header("Location: " . $_REQUEST[...])'
      - pattern: 'header("Location: " . $_SERVER[...])'
      - pattern: header($_GET[...])
      - pattern: header($_POST[...])
      - pattern: header($_REQUEST[...])


  - id: php-mail-fifth-param-user-controlled
    languages: [php]
    severity: ERROR
    message: >-
      mail() 5th parameter passes flags to sendmail. -X / -OQueueDirectory /
      -C let an attacker write a log file containing PHP code anywhere
      writable, then include() it → RCE. Combined with putenv() this is also
      the LD_PRELOAD escape route. Drop the 5th param or hard-code it.
    metadata:
      category: security
      cwe: "CWE-77"
      vuln-research-domain: command-injection
      confidence: HIGH
    pattern-either:
      - pattern: mail($A, $B, $C, $D, $_GET[...])
      - pattern: mail($A, $B, $C, $D, $_POST[...])
      - pattern: mail($A, $B, $C, $D, $_REQUEST[...])
      - pattern: mail($A, $B, $C, $D, $E)
      - pattern: mb_send_mail($A, $B, $C, $D, $_GET[...])
      - pattern: mb_send_mail($A, $B, $C, $D, $E)
    pattern-not-either:
      - pattern: mail($A, $B, $C, $D, "...")
      - pattern: mb_send_mail($A, $B, $C, $D, "...")


  # ---------------------------------------------------------------------------
  # Variable manipulation — extract / parse_str / variable variables
  # ---------------------------------------------------------------------------
  - id: php-extract-superglobal
    languages: [php]
    severity: ERROR
    message: >-
      extract() from a superglobal silently overwrites every local variable
      with the attacker's keys. Re-creates the register_globals attack
      surface — bypass auth flags, overwrite paths, inject template vars.
      Pass EXTR_SKIP or EXTR_PREFIX_ALL, or just don't extract.
    metadata:
      category: security
      cwe: "CWE-621: Variable Extraction Error"
      vuln-research-domain: variable-overwrite
      confidence: HIGH
    pattern-either:
      - pattern: extract($_GET)
      - pattern: extract($_POST)
      - pattern: extract($_REQUEST)
      - pattern: extract($_COOKIE)
      - pattern: extract($_GET, ...)
      - pattern: extract($_POST, ...)
    pattern-not-either:
      - pattern: extract($_GET, EXTR_SKIP)
      - pattern: extract($_POST, EXTR_SKIP)
      - pattern: extract($_GET, EXTR_PREFIX_ALL, ...)
      - pattern: extract($_POST, EXTR_PREFIX_ALL, ...)


  - id: php-parse-str-no-result-array
    languages: [php]
    severity: ERROR
    message: >-
      parse_str() with only one argument writes into the local symbol table
      (register_globals-like). Same overwrite-everything risk as
      extract($_GET). Always pass the &$result reference as the second arg.
      Removed-default behavior in PHP 8.
    metadata:
      category: security
      cwe: "CWE-621"
      vuln-research-domain: variable-overwrite
      confidence: HIGH
    pattern-either:
      - pattern: parse_str($X)


