  # ---------------------------------------------------------------------------
  # Auth bypass — loose-comparison password check
  # ---------------------------------------------------------------------------
  - id: php-auth-loose-password-comparison
    languages: [php]
    severity: ERROR
    message: >-
      Password compared with == (loose). Combined with magic-hash strings
      ("0e..." md5 collisions) this bypasses auth. Always use
      password_verify() or hash_equals() with a constant-time comparison.
    metadata:
      category: security
      cwe: "CWE-697"
      vuln-research-domain: auth-bypass
      confidence: HIGH
    pattern-either:
      - pattern: $_GET["password"] == $X
      - pattern: $_POST["password"] == $X
      - pattern: $_REQUEST["password"] == $X
      - pattern: $X == $_GET["password"]
      - pattern: $X == $_POST["password"]
      - pattern: $PASS == $X
    metavariable-regex:
      metavariable: $PASS
      regex: '\$_(?:GET|POST|REQUEST)\[["''](?:password|passwd|pwd|pass|secret|token|api_key|apikey)["'']\]'


