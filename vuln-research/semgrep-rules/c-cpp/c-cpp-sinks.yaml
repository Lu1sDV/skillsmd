      - pattern-not: $VECTOR.at($INDEX)


  # --- array::operator[] without at() ---
  - id: cpp-stl-array-operator-bracket
    languages: [cpp]
    severity: WARNING
    message: >-
      std::array::operator[] has no bounds check. Use at() instead.
