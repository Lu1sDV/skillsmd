  # ============================================================================
  # §10  DLL SEARCH PATH HIJACKING — Gap Sinks
  # ============================================================================
  #
  # LoadLibrary-family functions that search a default set of directories
  # before the application directory, enabling DLL preloading attacks.
  # ---------------------------------------------------------------------------

  - id: cpp-dll-hijacking-loadlibrary
    languages: [c, cpp]
    severity: WARNING
    message: >-
      LoadLibrary() loads a DLL using the standard search order. If a
      malicious DLL with the same name exists in a searched directory
      before the safe directory, code injection occurs. Use
      LoadLibraryEx() with LOAD_LIBRARY_SEARCH_APPLICATION_DIR or
      LOAD_LIBRARY_SEARCH_SYSTEM32 to restrict the search path.
    metadata:
      category: security
      cwe: "CWE-427: Uncontrolled Search Path Element"
      vuln-research-domain: dll-hijacking
      confidence: MEDIUM
    patterns:
      - pattern: LoadLibrary($NAME)


  - id: cpp-dll-hijacking-loadlibraryex
    languages: [c, cpp]
    severity: WARNING
    message: >-
      LoadLibraryEx() loads a DLL with flags. If dwFlags is 0, the default
      unsafe search order applies. Specify LOAD_LIBRARY_SEARCH_APPLICATION_DIR
      or LOAD_LIBRARY_SEARCH_SYSTEM32 to prevent DLL hijacking.
    metadata:
      category: security
      cwe: "CWE-427: Uncontrolled Search Path Element"
      vuln-research-domain: dll-hijacking
      confidence: MEDIUM
    patterns:
      - pattern: LoadLibraryEx($NAME, $FILE, $FLAGS)


