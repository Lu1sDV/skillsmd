  # --- vector::operator[] without at() ---
  - id: cpp-stl-vector-operator-bracket
    languages: [cpp]
    severity: WARNING
    message: >-
      std::vector::operator[] provides no bounds checking. Use at()
      for safe access, or validate the index against size() first.
