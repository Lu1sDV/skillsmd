  # --- CryptAcquireContext with MS_DEF_PROV ---
  - id: cpp-windows-cryptacquirecontext-weak-provider
    languages: [c, cpp]
    severity: WARNING
    message: >-
      CryptAcquireContext with MS_DEF_PROV or MS_DEF_PROV_A uses the
      Microsoft Base Cryptographic Provider which defaults to RSA
      keys with only 512-bit strength. Use MS_ENH_RSA_AES_PROV or
      use CNG APIs (BCrypt* / NCrypt*).
