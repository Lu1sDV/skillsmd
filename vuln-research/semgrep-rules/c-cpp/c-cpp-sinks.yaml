  # ============================================================================
  # §8  C++ SEMANTICS
  # ============================================================================
  #
  # Rules covering core C++ language semantics: casts, lifetime, move
  # semantics, exception safety, threading primitives, and atomics.
  # ---------------------------------------------------------------------------

  # --- reinterpret_cast on tainted data ---
  - id: cpp-semantics-reinterpret-cast-tainted
    languages: [cpp]
    severity: WARNING
    message: >-
      reinterpret_cast on data from an untrusted source. reinterpret_cast
      bypasses type safety and can convert arbitrary bit patterns to any
      type, potentially violating alignment or strict aliasing rules.
      If the reinterpreted data is attacker-controlled, type confusion
      with security impact may follow.
    metadata:
      category: security
      cwe: "CWE-704: Incorrect Type Conversion or Cast"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    patterns:
      - pattern: reinterpret_cast<$TYPE>($EXPR)


  # --- static_cast downcast without RTTI ---
  - id: cpp-semantics-static-cast-downcast
    languages: [cpp]
    severity: WARNING
    message: >-
      static_cast downcasting a base class pointer to a derived class
      pointer without RTTI validation. If the actual object is not of
      the target derived type, undefined behavior follows (type confusion).
      Use dynamic_cast and check the result.
    metadata:
      category: security
      cwe: "CWE-704: Incorrect Type Conversion or Cast"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: static_cast<$DERIVED *>($BASE_PTR)


  # --- dynamic_cast result not checked ---
  - id: cpp-semantics-dynamic-cast-unchecked
    languages: [cpp]
    severity: WARNING
    message: >-
      dynamic_cast<T*>(expr) returns nullptr if the cast fails. If the
      result is used without a null check, a null-pointer dereference
      follows. Always check the result of dynamic_cast for null.
    metadata:
      category: security
      cwe: "CWE-476: NULL Pointer Dereference"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: |
          if (auto $P = dynamic_cast<$TYPE *>($EXPR)) { ... }
      - pattern-not-inside: |
          if (auto $P = dynamic_cast<$TYPE *>($EXPR)) { ... if ($P) { ... } ... }


  # --- const_cast removing const from originally-const ---
  - id: cpp-semantics-const-cast-originally-const
    languages: [cpp]
    severity: WARNING
    message: >-
      const_cast is used to remove const from a variable that was
      originally declared const. Modifying such a variable is undefined
      behavior. Ensure the object was not originally const, or remove
      the const-correctness issue instead of casting it away.
    metadata:
      category: security
      cwe: "CWE-704: Incorrect Type Conversion or Cast"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: const_cast<$TYPE>($EXPR)


  # --- use-after-move ---
  - id: cpp-semantics-use-after-move
    languages: [cpp]
    severity: WARNING
    message: >-
      Object accessed after being moved from (std::move). After move,
      the original object is in a valid but unspecified state. Accessing
      it (except to destroy or reassign) may cause use-after-free or
      undefined behavior. Do not use the original after move unless
      it is reassigned first.
    metadata:
      category: security
