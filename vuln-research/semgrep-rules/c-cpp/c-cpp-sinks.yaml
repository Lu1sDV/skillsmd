  # ============================================================================
  # §7  TOCTOU / RACE CONDITION — Gap Sinks
  # ============================================================================
  #
  # Functions that operate on file system objects by name, creating a
  # time-of-check-to-time-of-use window. Also vfork() which shares address
  # space between parent and child without synchronisation.
  # ---------------------------------------------------------------------------

  - id: cpp-toctou-race-chmod
    languages: [c, cpp]
    severity: ERROR
    message: >-
      chmod() changes file permissions by path. Between a prior access
      check and the chmod call, an attacker can replace the file with a
      symlink to a privileged file. Use fchmod() on a file descriptor.
    metadata:
      category: security
      cwe: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization"
      vuln-research-domain: toctou-race
      confidence: MEDIUM
    patterns:
      - pattern: chmod($PATH, $MODE)


  - id: cpp-toctou-race-chown
    languages: [c, cpp]
    severity: ERROR
    message: >-
      chown() changes file ownership by path. TOCTOU race: an attacker can
      replace the file between check and use. Use fchown() on a file
      descriptor.
    metadata:
      category: security
      cwe: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization"
      vuln-research-domain: toctou-race
      confidence: MEDIUM
    patterns:
      - pattern: chown($PATH, $OWNER, $GROUP)


  - id: cpp-toctou-race-chgrp
    languages: [c, cpp]
    severity: ERROR
    message: >-
      chgrp() changes file group by path. Susceptible to TOCTOU symlink
      races. Use fchgrp() on a file descriptor.
    metadata:
      category: security
      cwe: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization"
      vuln-research-domain: toctou-race
      confidence: MEDIUM
    patterns:
      - pattern: chgrp($PATH, $GROUP)


  - id: cpp-toctou-race-vfork
    languages: [c, cpp]
    severity: ERROR
    message: >-
      vfork() creates a child process that shares the parent's address
      space. The child runs until _exit() or exec*(); any modification to
      shared state (file descriptors, variables) causes unpredictable
      parent behaviour. Use fork() which copies the address space.
    metadata:
      category: security
      cwe: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization"
      vuln-research-domain: toctou-race
      confidence: MEDIUM
    patterns:
      - pattern: vfork()


  # ============================================================================
  # §8  INSECURE TEMP FILE — Gap Sinks
  # ============================================================================
  #
  # Temporary file creation functions that generate predictable names or
  # create files in shared directories without O_EXCL, enabling symlink
  # attacks or information disclosure.
  # ---------------------------------------------------------------------------

  - id: cpp-insecure-temp-file-mktemp
    languages: [c, cpp]
    severity: WARNING
    message: >-
      mktemp() generates a predictable temporary file name. There is a
      race between the name generation and file creation. Use mkstemp()
      which atomically creates and opens the file, or boost::filesystem.
    metadata:
      category: security
      cwe: "CWE-377: Insecure Temporary File"
      vuln-research-domain: insecure-temp-file
      confidence: MEDIUM
    patterns:
      - pattern: mktemp($TEMPL)


  - id: cpp-insecure-temp-file-tmpnam
    languages: [c, cpp]
    severity: WARNING
    message: >-
      tmpnam() generates a temporary file name that may be predictable.
      The file must be opened separately, creating a TOCTOU race. Use
      mkstemp() or tmpfile() which create and open atomically.
    metadata:
      category: security
      cwe: "CWE-377: Insecure Temporary File"
      vuln-research-domain: insecure-temp-file
      confidence: MEDIUM
    patterns:
      - pattern: tmpnam($BUF)


  - id: cpp-insecure-temp-file-tempnam
    languages: [c, cpp]
    severity: WARNING
    message: >-
      tempnam() generates a temp file path in a given directory. The name
      may be predictable and a TOCTOU race exists between generation and
      open. Use mkstemp() which atomically creates and opens the file.
    metadata:
      category: security
      cwe: "CWE-377: Insecure Temporary File"
      vuln-research-domain: insecure-temp-file
      confidence: MEDIUM
    patterns:
      - pattern: tempnam($DIR, $PREFIX)


  - id: cpp-insecure-temp-file-gettempfilename
    languages: [c, cpp]
    severity: WARNING
    message: >-
      GetTempFileName() generates a temporary file name. If the uUnique
      parameter is 0, the name is predictable from the system tick count.
      There is a TOCTOU race between name generation and file creation.
      Use GetTempPath() + CreateFile() with OPEN_ALWAYS + FILE_FLAG_DELETE_ON_CLOSE.
    metadata:
      category: security
      cwe: "CWE-377: Insecure Temporary File"
      vuln-research-domain: insecure-temp-file
      confidence: MEDIUM
    patterns:
      - pattern: GetTempFileName($DIR, $PREFIX, $UNIQUE, $BUF)


