  - id: cpp-windows-cryptgenkey-weak-algo
    languages: [c, cpp]
    severity: WARNING
    message: >-
      CryptGenKey with CALG_RC4, CALG_DES, or CALG_3DES produces
      cryptographically weak keys. Use CALG_AES_128/256 or the CNG
