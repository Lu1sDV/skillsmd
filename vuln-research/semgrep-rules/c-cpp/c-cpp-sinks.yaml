    message: >-
      CoImpersonateClient() enables COM impersonation of the calling
      client. If the return is unchecked or RevertToSelf() is not called,
      the thread retains the client's privileges beyond the intended scope.
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      vuln-research-domain: privilege-mgmt
      confidence: MEDIUM
    patterns:
      - pattern: CoImpersonateClient()


  - id: cpp-privilege-mgmt-impersonatenamedpipeclient
    languages: [c, cpp]
    severity: ERROR
    message: >-
      ImpersonateNamedPipeClient() assumes the security context of a named
      pipe client. If the call fails (returns FALSE) or the impersonation
      is not reverted, the server may operate with incorrect privileges.
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      vuln-research-domain: privilege-mgmt
      confidence: MEDIUM
    patterns:
      - pattern: ImpersonateNamedPipeClient($PIPE)


  - id: cpp-privilege-mgmt-impersonateddeclientwindow
    languages: [c, cpp]
    severity: ERROR
    message: >-
      ImpersonateDdeClientWindow() impersonates the DDE client associated
