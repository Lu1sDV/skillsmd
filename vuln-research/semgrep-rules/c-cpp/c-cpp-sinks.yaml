---
# c-cpp sink rules — merged pack (one file per technology).
#
# Sources merged (dedup by rule id; on collision the richer definition wins):
#   - c-cpp-security-mega-pack.yaml  (404 rules)
#   - c-cpp-gap-sinks.yaml  (170 rules)
# Total: 555 rules
#
# Mirror rule: `references/sinks/c-cpp.md` is the human catalog for this pack —
# edit both together (doc = context/taxonomy, this file = executable detectors).
#
# Repairs applied at merge time (every repaired rule was re-verified to parse AND fire):
#   bare `$$$` arg lists        -> `(...)` / `, ...)`
#   unterminated statements    -> `;` appended
#   multi-statement sequences  -> `...` inserted between statements
#   `f(... X ...)` args        -> `f(..., X, ...)`
#   `<hdr> { ... X ... }`      -> pattern-inside + pattern
#   PHP text-shaped rules      -> pattern-regex (TEXTUAL)
#
# Repaired but NOT fire-verified against a sample (parse-valid only, 19 rules) —
# these may be inert; treat their hits as unconfirmed until exercised:
#   cpp-buffer-overflow-negative-loop-bound
#   cpp-command-injection-fork-exec-path
#   cpp-infoleak-uninit-struct-field
#   cpp-integer-overflow-malloc-count-sizeof
#   cpp-integer-overflow-promotion-bug
#   cpp-race-initgroups-before-setgid
#   cpp-semantics-exception-in-destructor
#   cpp-semantics-use-after-move
#   cpp-toctou-realpath-toctou
#   cpp-use-after-free-erase-in-for-each
#   cpp-use-after-free-free-after-delete
#   cpp-use-after-free-function-after-move
#   cpp-use-after-free-string-cstr-after-modify
#   cpp-use-after-free-unique-ptr-moved-from
#   cpp-use-after-free-unique-ptr-release-double-delete
#   cpp-use-after-free-unordered-map-rehash
#   cpp-use-after-free-vector-iterator-invalidation
#   cpp-use-after-free-vector-pushback-invalidation
#   cpp-use-after-free-xfree-after-free
#
# Dropped rules (no expressible semgrep pattern):
#   cpp-use-after-free-free-in-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-use-after-free-malloc-in-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-use-after-free-printf-in-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-use-after-free-exit-in-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-use-after-free-longjmp-in-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-use-after-free-strtok-in-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-use-after-free-mutex-in-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-race-privileged-op-signal-handler — linking a signal() registration to its handler body needs a join semgrep cannot express
#   cpp-dos-unbounded-recursion — no recursion primitive; the original pattern is a tautology
#
# Validate: semgrep --validate --config <this file>

rules:
  - id: cpp-buffer-overflow-wcscpy
    languages: [c, cpp]
    severity: ERROR
    message: >-
      wcscpy() performs unbounded wide string copy. If the source string
      exceeds the destination buffer, a stack or heap buffer overflow occurs.
      Use wcscpy_s() or StringCbCopyW() with an explicit buffer size.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: wcscpy($DEST, $SRC)


  - id: cpp-buffer-overflow-wcscat
    languages: [c, cpp]
    severity: ERROR
    message: >-
      wcscat() performs unbounded wide string concatenation. An overly long
      source string overflows the destination. Use wcscat_s() or
      StringCbCatW().
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: wcscat($DEST, $SRC)


  - id: cpp-buffer-overflow-wcsncat-misuse
    languages: [c, cpp]
    severity: WARNING
    message: >-
      wcsncat(dest, src, n) — the third argument is the maximum number of
      wchar_t to append, NOT the total buffer size. If dest has N wchar_t of
      space, pass N - wcslen(dest) - 1, not N. Off-by-one is common here.
    metadata:
      category: security
      cwe: "CWE-193: Off-by-one Error"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: wcsncat($DEST, $SRC, wcslen($DEST))


  - id: cpp-buffer-overflow-wmemcpy
    languages: [c, cpp]
    severity: ERROR
    message: >-
      wmemcpy() copies a fixed number of wide characters without bounds
      checking against the destination capacity. If count exceeds the dest
      allocation, a buffer overflow follows. Validate that count <= dest size
      in wchar_t units.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: wmemcpy($DEST, $SRC, $COUNT)


  - id: cpp-buffer-overflow-wmemmove
    languages: [c, cpp]
    severity: WARNING
    message: >-
      wmemmove() copies wide characters without range checking. If the count
      parameter exceeds the distance between source and destination or exceeds
      the destination capacity, memory corruption results.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: wmemmove($DEST, $SRC, $COUNT)


  - id: cpp-buffer-overflow-wmemset
    languages: [c, cpp]
    severity: WARNING
    message: >-
      wmemset() fills a buffer with a wide character. If count exceeds the
      allocated size, the write overflows the destination.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: wmemset($DEST, $VAL, $COUNT)


  - id: cpp-buffer-overflow-wscanf
    languages: [c, cpp]
    severity: ERROR
    message: >-
      wscanf() family (wscanf, fwscanf, swscanf) without width specifier on
      %s/%S conversions reads unbounded wide input, causing buffer overflow.
      Always specify the maximum width, e.g. L"%32s".
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    pattern-either:
      - pattern: wscanf($FMT, ...)
      - pattern: fwscanf(...)
      - pattern: swscanf(...)
      - pattern: vwscanf(...)
      - pattern: vfwscanf(...)
      - pattern: vswscanf(...)


  - id: cpp-buffer-overflow-swprintf
    languages: [c, cpp]
    severity: ERROR
    message: >-
      swprintf() takes a maximum number of wchar_t to write, but if the
      return value (number of characters that WOULD have been written) is
      used as an index or size without checking for >= dest capacity, buffer
      overflow follows. Always validate the return.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    pattern-either:
      - pattern: swprintf($DEST, $DEST_SIZE, $FMT, ...)


  - id: cpp-buffer-overflow-getws
    languages: [c, cpp]
    severity: ERROR
    message: >-
      getws() reads unbounded wide-character input from stdin into the
      provided buffer. If input exceeds buffer size, stack/heap overflow
      occurs. Use fgetws() with an explicit size parameter.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: HIGH
    patterns:
      - pattern: getws($BUF)


  - id: cpp-buffer-overflow-fgetws-size
    languages: [c, cpp]
    severity: WARNING
    message: >-
      fgetws(buf, n, stream) reads up to n-1 wide characters. If n is
      derived from a user-controlled value or is larger than the actual
      buffer allocation, the read may overflow the buffer. Verify n <=
      sizeof(buf)/sizeof(wchar_t) or use a constant safe size.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: fgetws($BUF, $N, ...)


  # --- Windows TCHAR / generic-text mappings ---
  - id: cpp-buffer-overflow-tcscpy
    languages: [c, cpp]
    severity: ERROR
    message: >-
      _tcscpy() resolves to strcpy() or wcscpy() depending on UNICODE
      define — both unbounded. A source longer than the destination causes
      buffer overflow. Replace with _tcscpy_s().
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    pattern-either:
      - pattern: _tcscpy($DEST, $SRC)
      - pattern: _ftcscpy($DEST, $SRC)


  - id: cpp-buffer-overflow-tcscat
    languages: [c, cpp]
    severity: ERROR
    message: >-
      _tcscat() resolves to strcat() or wcscat() — both unbounded.
      Appending a long string overflows the destination. Use _tcscat_s().
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    pattern-either:
      - pattern: _tcscat($DEST, $SRC)
      - pattern: _ftcscat($DEST, $SRC)


  - id: cpp-buffer-overflow-tcsncat
    languages: [c, cpp]
    severity: WARNING
    message: >-
      _tcsncat(dest, src, n) is the bounded version but n is the max
      characters to append, not the total buffer size. Off-by-one and
      truncation issues are common. Verify the count argument.
    metadata:
      category: security
      cwe: "CWE-193: Off-by-one Error"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: _tcsncat($DEST, $SRC, $N)


  - id: cpp-buffer-overflow-tcscpy-s-size
    languages: [c, cpp]
    severity: WARNING
    message: >-
      _tcscpy_s(dest, dest_size, src) requires the destination size in
      elements. If dest_size is sizeof(dest) on a pointer rather than an
      array, or if sizeof includes the null terminator incorrectly, the
      copy may still overflow. Verify dest_size is correct.
    metadata:
      category: security
      cwe: "CWE-131: Incorrect Calculation of Buffer Size"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    pattern-either:
      - pattern: _tcscpy_s($DEST, sizeof($DEST), $SRC)
      - pattern: _tcscpy_s($DEST, sizeof($SRC), $SRC)


  # --- Windows lstrcpy / lstrcat (dangerous even in "safe" forms) ---
  - id: cpp-buffer-overflow-lstrcpy
    languages: [c, cpp]
    severity: ERROR
    message: >-
      lstrcpy() is a Windows API that copies a string without any size
      limit. An overlong source overflows the destination. Use
      StringCbCopy() or StringCchCopy().
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: lstrcpy($DEST, $SRC)


  - id: cpp-buffer-overflow-lstrcat
    languages: [c, cpp]
    severity: ERROR
    message: >-
      lstrcat() concatenates a string without size limits. Buffer overflow
      occurs if the combined length exceeds the destination allocation.
      Use StringCbCat() or StringCchCat().
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: lstrcat($DEST, $SRC)


  - id: cpp-buffer-overflow-lstrcpyn
    languages: [c, cpp]
    severity: WARNING
    message: >-
      lstrcpyn(dest, src, count) copies up to count characters. However,
      count includes the null terminator, and if src is longer than count-1,
      the string is silently truncated — use with care.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: lstrcpyn($DEST, $SRC, $COUNT)


  # --- Windows shell string APIs ---
  - id: cpp-buffer-overflow-wnsprintf
    languages: [c, cpp]
    severity: ERROR
    message: >-
      wnsprintf() is a Windows shell API that writes formatted output into
      a buffer of specified size but can overflow if the format string is
      long or arguments exceed expectations. Use StringCchPrintf() instead.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: wnsprintf($BUF, $COUNT, $FMT, ...)


  - id: cpp-buffer-overflow-strcpyn
    languages: [c, cpp]
    severity: WARNING
    message: >-
      StrCpyN() copies up to N characters but does NOT guarantee
      null-termination if the source is N or longer. This can lead to
      read overflow on subsequent string operations. Use StrCpyNA() or
      StringCchCopy().
    metadata:
      category: security
      cwe: "CWE-170: Improper Null Termination"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: StrCpyN($DEST, $SRC, $N)


  - id: cpp-buffer-overflow-strcatbuff
    languages: [c, cpp]
    severity: ERROR
    message: >-
      StrCatBuff() concatenates a string onto a buffer. If the source length
      exceeds remaining space, overflow occurs. Use StringCbCat() or
      StringCchCat() which return HRESULT.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: StrCatBuff($DEST, $SRC, $SIZE)


  - id: cpp-buffer-overflow-strcatn
    languages: [c, cpp]
    severity: ERROR
    message: >-
      StrCatN() concatenates a specified number of characters without
      ensuring the total fits in the destination. Use StringCbCatN() or
      StringCchCatN().
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: StrCatN($DEST, $SRC, $N)


  - id: cpp-buffer-overflow-strccpy
    languages: [c, cpp]
    severity: WARNING
    message: >-
      StrCCpy() is a Windows shell function that copies a substring.
      The destination buffer size is not directly provided, making
      overflow possible if the source is longer than expected.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: StrCCpy($DEST, $SRC, $SKIP)


  # --- BSTR / COM string patterns ---
  - id: cpp-buffer-overflow-sysallocstringlen
    languages: [c, cpp]
    severity: WARNING
    message: >-
      SysAllocStringLen() allocates a BSTR of the given length. If the
      length parameter is tainted or computed from untrusted data, the
      allocated BSTR may be undersized, leading to overflow on subsequent
      write. Validate the length argument.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: SysAllocStringLen($SRC, $LEN)


  - id: cpp-buffer-overflow-sysreallocstringlen
    languages: [c, cpp]
    severity: WARNING
    message: >-
      SysReAllocStringLen() reallocates a BSTR. If the new length is
      tainted or zero, the function may free the old BSTR and allocate
      a zero-length BSTR, causing subsequent writes to overflow.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: SysReAllocStringLen($PBSTR, $SRC, $LEN)


  # --- Strcpy_s / strcat_s / sprintf_s family (bounds-checked but misused) ---
  - id: cpp-buffer-overflow-strcpy-s-size-mismatch
    languages: [c, cpp]
    severity: WARNING
    message: >-
      strcpy_s(dest, dest_size, src) — if dest_size is computed incorrectly
      (e.g. sizeof(pointer) instead of sizeof(array), or from an unsigned
      underflow), the bounds check fails and overflow may occur. Verify the
      buffer size argument.
    metadata:
      category: security
      cwe: "CWE-131: Incorrect Calculation of Buffer Size"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    pattern-either:
      - pattern: strcpy_s($DEST, sizeof($SRC), $SRC)
      - pattern: strcpy_s($DEST, sizeof($PTR), $SRC)
      - pattern: wcscpy_s($DEST, sizeof($SRC), $SRC)
      - pattern: wcscpy_s($DEST, sizeof($PTR), $SRC)


  - id: cpp-buffer-overflow-strcat-s-size-mismatch
    languages: [c, cpp]
    severity: WARNING
    message: >-
      strcat_s(dest, dest_size, src) requires the total size of dest, not
      the remaining space. Passing sizeof(src) instead of sizeof(dest)
      defeats the bounds check.
    metadata:
      category: security
      cwe: "CWE-131: Incorrect Calculation of Buffer Size"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: strcat_s($DEST, sizeof($SRC), $SRC)


  - id: cpp-buffer-overflow-sprintf-s
    languages: [c, cpp]
    severity: WARNING
    message: >-
      sprintf_s(buf, bufsz, fmt, ...) is bounds-checked but if bufsz is
      incorrect (e.g. sizeof pointer, user-controlled value, or 0), the
      function will either write into an undersized buffer or invoke the
      constraint handler (crash). Validate the size argument.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: sprintf_s($BUF, $SZ, $FMT, ...)


  - id: cpp-buffer-overflow-strcat-s-return-ignored
    languages: [c, cpp]
    severity: WARNING
    message: >-
      strcat_s() returns errno_t (zero on success, non-zero on failure).
      Ignoring the return means overflow or truncation goes undetected.
    metadata:
      category: security
      cwe: "CWE-252: Unchecked Return Value"
      vuln-research-domain: buffer-overflow
      confidence: LOW
    patterns:
      - pattern: strcat_s($DEST, $SZ, $SRC);
      - pattern-not: $RET = strcat_s(...)
      - pattern-not: if (strcat_s(...) ...) ...


  - id: cpp-buffer-overflow-strcpy-s-return-ignored
    languages: [c, cpp]
    severity: WARNING
    message: >-
      strcpy_s() return ignored. Failure (buffer too small) may leave
      dest in an inconsistent state.
    metadata:
      category: security
      cwe: "CWE-252: Unchecked Return Value"
      vuln-research-domain: buffer-overflow
      confidence: LOW
    patterns:
      - pattern: strcpy_s($DEST, $SZ, $SRC);
      - pattern-not: $RET = strcpy_s(...)


  # --- memcpy with tainted length ---
  - id: cpp-buffer-overflow-memcpy-tainted-len
    languages: [c, cpp]
    severity: ERROR
    message: >-
      memcpy() with a length that may be derived from tainted data.
      If the length exceeds the destination allocation, heap/stack
      overflow follows. Bounds-check the length against destination
      capacity before copying.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: memcpy($DEST, $SRC, $LEN)
      - pattern-not: memcpy($DEST, $SRC, sizeof($DEST))
      - pattern-not: memcpy($DEST, $SRC, sizeof($DEST) - $OFF)
      - pattern-not: memcpy($DEST, $SRC, sizeof($SRC))
      - pattern-not: memcpy($DEST, $SRC, 0)
      - pattern-not: memcpy($DEST, $SRC, 1)
      - pattern-not: memcpy($DEST, $SRC, $CONST)


  - id: cpp-buffer-overflow-memset-tainted-len
    languages: [c, cpp]
    severity: ERROR
    message: >-
      memset() with a tainted/unsigned underflow prone length argument.
      If the length exceeds the buffer allocation or wraps around, memory
      corruption follows. Validate the length before calling.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: memset($DEST, $VAL, $LEN)
      - pattern-not: memset($DEST, $VAL, sizeof($DEST))
      - pattern-not: memset($DEST, $VAL, $CONST)


  # --- memmove with tainted length ---
  - id: cpp-buffer-overflow-memmove-tainted-len
    languages: [c, cpp]
    severity: ERROR
    message: >-
      memmove() with a tainted length argument. Even though memmove handles
      overlapping regions safely, if the length exceeds the destination
      buffer, overflow occurs. Validate against destination capacity.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: memmove($DEST, $SRC, $LEN)


  # --- RtlCopyMemory / RtlMoveMemory / RtlFillMemory ---
  - id: cpp-buffer-overflow-rtl-copy-memory
    languages: [c, cpp]
    severity: ERROR
    message: >-
      RtlCopyMemory() is a direct wrapper around memcpy on Windows. A
      tainted-length parameter can cause buffer overflow. Prefer
      RtlCopyMemory with validated size.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: RtlCopyMemory($DEST, $SRC, $LEN)


  - id: cpp-buffer-overflow-rtl-move-memory
    languages: [c, cpp]
    severity: ERROR
    message: >-
      RtlMoveMemory() copies memory between potentially overlapping
      regions. If the length byte count exceeds the destination allocation,
      overflow follows.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: RtlMoveMemory($DEST, $SRC, $LEN)


  - id: cpp-buffer-overflow-rtl-fill-memory
    languages: [c, cpp]
    severity: ERROR
    message: >-
      RtlFillMemory() fills memory with a byte value. If the fill length
      exceeds the target buffer, memory corruption results.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: RtlFillMemory($DEST, $LEN, $VAL)


  # --- Windows WriteFile with wrong size ---
  - id: cpp-buffer-overflow-writefile-size
    languages: [c, cpp]
    severity: WARNING
    message: >-
      WriteFile() writes nNumberOfBytesToWrite bytes from the buffer. If
      the count is larger than the buffer allocation, an out-of-bounds
      read or info leak follows. Validate the count against buffer size.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: WriteFile($HANDLE, $BUF, $COUNT, ...)


  - id: cpp-buffer-overflow-readfile-size
    languages: [c, cpp]
    severity: WARNING
    message: >-
      ReadFile() reads up to nNumberOfBytesToRead into the buffer. If
      the count exceeds the buffer allocation, overflow follows. Validate
      count against buffer size before calling.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: ReadFile($HANDLE, $BUF, $COUNT, ...)


  # --- StringCchCopy / StringCbCopy ---
  - id: cpp-buffer-overflow-stringcchcopy-return-ignored
    languages: [c, cpp]
    severity: WARNING
    message: >-
      StringCchCopy() returns an HRESULT indicating success (S_OK) or
      failure (STRSAFE_E_INSUFFICIENT_BUFFER). If the return is ignored,
      truncation or incomplete copy may go undetected, potentially leading
      to buffer overflow in downstream code.
    metadata:
