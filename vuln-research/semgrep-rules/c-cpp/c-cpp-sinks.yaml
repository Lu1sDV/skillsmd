  # --- CreateProcess unquoted path ---
  - id: cpp-windows-createprocess-unquoted-path
    languages: [c, cpp]
    severity: WARNING
    message: >-
      CreateProcess(lpApplicationName, lpCommandLine, ...) where
      lpApplicationName or the first element of lpCommandLine contains
      spaces but is not quoted. Windows will search for the executable
      in a predictable order, potentially loading a malicious binary
      placed earlier in the path (unquoted service path vulnerability).
      Always quote the executable path: "C:\\Program Files\\App\\app.exe".
    metadata:
      category: security
      cwe: "CWE-428: Unquoted Search Path"
      vuln-research-domain: windows
      confidence: MEDIUM
    patterns:
      - pattern: CreateProcess($APP, $CMD, ...)


  # --- LoadLibrary without full path ---
  - id: cpp-windows-loadlibrary-without-path
    languages: [c, cpp]
    severity: ERROR
    message: >-
      LoadLibrary(lpFileName) / LoadLibraryEx without absolute path.
      Windows searches the DLL in the application directory, current
      working directory, System32, and PATH. An attacker who can place
      a malicious DLL earlier in the search order achieves DLL hijacking.
      Always use an absolute path to the DLL.
    metadata:
      category: security
      cwe: "CWE-114: Uncontrolled Search Path Element"
      vuln-research-domain: windows
      confidence: HIGH
    pattern-either:
      - pattern: LoadLibrary($NAME)
      - pattern: LoadLibraryEx($NAME, ...)
      - pattern: LoadLibraryW($NAME)
      - pattern: LoadLibraryA($NAME)


  - id: cpp-windows-loaadlibrary-user-path
    languages: [c, cpp]
    severity: ERROR
    message: >-
      LoadLibrary with a path derived from user input. An attacker can
      cause arbitrary DLL loading and code execution.
    metadata:
      category: security
      cwe: "CWE-114: Uncontrolled Search Path Element"
      vuln-research-domain: windows
      confidence: MEDIUM
    patterns:
      - pattern: LoadLibrary($FILE)


