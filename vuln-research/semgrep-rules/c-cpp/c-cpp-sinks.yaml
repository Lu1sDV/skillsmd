  # ============================================================================
  # §5  INTEGER OVERFLOW / TYPE CONFUSION
  # ============================================================================
  #
  # 0xdea already covers: integer wraparound (general), strlen truncation,
  # truncation on assignment, signed-unsigned conversion, unsigned comparison
  # always false.
  #
  # This section adds allocation overflow patterns, specific arithmetic
  # pitfalls, strict aliasing, shift overflows, and off_t/ptrdiff_t issues.
  # ---------------------------------------------------------------------------

  # --- Multiplication overflow in allocation size ---
  - id: cpp-integer-overflow-malloc-count-sizeof
    languages: [c, cpp]
    severity: ERROR
    message: >-
      malloc(count * sizeof(type)) where count is user-controlled. If the
      product wraps around (size_t overflow), a small allocation results
      and subsequent writes overflow the buffer. Use calloc() which checks
      for overflow, or perform a runtime check: if (count > SIZE_MAX/sizeof(type)).
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: HIGH
    patterns:
      - pattern: malloc($EXPR * sizeof($TYPE))
      - pattern: malloc($EXPR * $SZ)
      - pattern: malloc(sizeof($TYPE) * $EXPR)


  - id: cpp-integer-overflow-realloc-count-sizeof
    languages: [c, cpp]
    severity: ERROR
    message: >-
      realloc(ptr, count * sizeof(type)) where count is user-controlled.
      Integer overflow in the multiplication leads to undersized allocation.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: HIGH
    patterns:
      - pattern: realloc($PTR, $EXPR * sizeof($TYPE))
      - pattern: realloc($PTR, sizeof($TYPE) * $EXPR)


  - id: cpp-integer-overflow-calloc-ineffective
    languages: [c, cpp]
    severity: ERROR
    message: >-
      calloc(1, count * sizeof(type)) defeats calloc's built-in overflow
      protection. calloc(n, size) checks that n * size does not overflow,
      but if the caller passes a pre-multiplied size as the second argument,
      the overflow already happened in the caller's expression. Use
      calloc(count, sizeof(type)) directly.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: HIGH
    patterns:
      - pattern: calloc(1, $EXPR * sizeof($TYPE))
      - pattern: calloc(1, sizeof($TYPE) * $EXPR)


  - id: cpp-integer-overflow-new-array-user-size
    languages: [c, cpp]
    severity: ERROR
    message: >-
      new T[n] where n is user-controlled. Integer overflow in the array
      size calculation (n * sizeof(T)) can produce a small allocation.
      Use std::vector instead, or validate n < SIZE_MAX / sizeof(T).
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: new $TYPE[$NON_CONST]


  - id: cpp-integer-overflow-malloc-addition
    languages: [c, cpp]
    severity: ERROR
    message: >-
      malloc(a + b) where either operand is user-controlled. If a + b
      wraps around (on 32-bit or due to size_t underflow from signed
      negative), the allocation is too small. Use calloc() or validate
      a + b > a (check for wrap).
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: HIGH
    patterns:
      - pattern: malloc($A + $B)


  - id: cpp-integer-overflow-reallocarray-return-not-checked
    languages: [c, cpp]
    severity: WARNING
    message: >-
      reallocarray() return not checked. On failure it returns NULL,
