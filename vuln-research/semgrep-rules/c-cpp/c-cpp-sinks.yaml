  # --- cout of pointer ---
  - id: cpp-infoleak-cout-pointer
    languages: [cpp]
    severity: WARNING
    message: >-
      std::cout << some_pointer outputs a memory address. This leaks
      address space layout info. Cast to void* explicitly only when
      needed for debugging, not in production output visible to users.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: MEDIUM
    patterns:
      - pattern: cout << $PTR


  # --- send of struct with padding ---
  - id: cpp-infoleak-send-struct-padding
    languages: [c, cpp]
    severity: WARNING
    message: >-
      send() of a struct directly to a network socket. Structs have
      compiler-inserted padding bytes between members. These padding
      bytes are uninitialized and may contain sensitive data from
      previous stack/heap use. Serialize struct members individually
      or use memset before copying.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: MEDIUM
    patterns:
      - pattern: send($SOCK, &$STRUCT, sizeof($STRUCT), ...)


  # --- write of struct with padding ---
  - id: cpp-infoleak-write-struct-padding
    languages: [c, cpp]
    severity: WARNING
    message: >-
      write(fd, &struct, sizeof(struct)) writes padding bytes to a file
      or socket, leaking uninitialized memory.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: MEDIUM
    patterns:
      - pattern: write($FD, &$STRUCT, sizeof($STRUCT))


  # --- uninitialized struct field sent over network ---
  - id: cpp-infoleak-uninit-struct-field
    languages: [c, cpp]
    severity: WARNING
    message: >-
      struct variable not fully initialized before being sent over the
      network. If any field (or padding) is left uninitialized, kernel
      heap/stack memory may be leaked. Use memset(&struct, 0, sizeof(struct))
      or aggregate initialization.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: MEDIUM
    patterns:
      - pattern: |
          struct $TYPE $VAR;
          ...
          send(... &$VAR ...);


  # --- sizeof(struct) as network length ---
  - id: cpp-infoleak-sizeof-struct-network
    languages: [c, cpp]
    severity: WARNING
    message: >-
      sizeof(struct) used as the number of bytes to send/receive over the
      network. If the struct contains padding, the receiving side gets
      uninitialized padding bytes. If the struct contains pointers, the
      pointer values (not the pointed-to data) are transmitted. Use
      a serialization format instead.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: MEDIUM
    patterns:
      - pattern: send($SOCK, $BUF, sizeof($STRUCT), ...)


  # --- debug_backtrace / backtrace_symbols in production ---
  - id: cpp-infoleak-backtrace-production
    languages: [c, cpp]
    severity: WARNING
    message: >-
      backtrace() / backtrace_symbols() in production code that is
      accessible to users. This leaks function names and file offsets,
      revealing internal implementation details. Remove in production
      builds or restrict to internal error reporting.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: MEDIUM
    pattern-either:
      - pattern: backtrace(...)
      - pattern: backtrace_symbols(...)


  # --- perror with user string ---
  - id: cpp-infoleak-perror-user-string
    languages: [c, cpp]
    severity: WARNING
    message: >-
      perror(str) with a user-controlled string. The string is printed
      to stderr. If the process stderr is exposed to users (e.g., via
      CGI error output), this leaks the error string to the attacker.
      Use syslog() for privileged error reporting.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: LOW
    patterns:
      - pattern: perror($STR)
      - pattern-not: perror("...")


  # --- HRESULT/NTSTATUS returned to user ---
  - id: cpp-infoleak-hresult-returned
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Internal HRESULT, NTSTATUS, or errno value returned to the user.
      These codes may reveal internal system state, file existence,
      or server path information. Map to user-friendly error messages
      instead.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: LOW
    pattern: return GetLastError();


  # --- GetModuleFileName exposed ---
  - id: cpp-infoleak-getmodulefilename
    languages: [c, cpp]
    severity: WARNING
    message: >-
      GetModuleFileName() retrieves the full path to the executable or
      DLL. If this path is exposed to the user (e.g., in an error message),
      it reveals filesystem layout information.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: information-disclosure
      confidence: LOW
    patterns:
      - pattern: GetModuleFileName($MODULE, $BUF, $SIZE)


  # --- assert enabled in production (reachable) ---
  - id: cpp-infoleak-assert-reachable
    languages: [c, cpp]
    severity: WARNING
    message: >-
      assert() expression that evaluates an expression with side effects.
      In release builds where NDEBUG is defined, assert is stripped and
      the side effects disappear, causing logic errors. Never put
      security-relevant checks in assert.
    metadata:
      category: security
      cwe: "CWE-617: Reachable Assertion"
      vuln-research-domain: information-disclosure
      confidence: MEDIUM
    patterns:
      - pattern: assert($EXPR)
      - pattern-not: assert("...")


  # ============================================================================
  # §12  CRYPTO WEAKNESS
  # ============================================================================
  #
  # Rules for weak cryptographic algorithms, insufficient key lengths,
  # improper use of crypto APIs, and hardcoded secrets.
  # ---------------------------------------------------------------------------

  # --- DES/3DES encryption ---
  - id: cpp-crypto-des-3des
    languages: [c, cpp]
    severity: WARNING
    message: >-
      DES or 3DES encryption algorithm used. DES is broken (56-bit keys
      brute-forced in hours). 3DES (TDEA) provides only ~112 bits and is
      deprecated by NIST. Use AES-128/256 instead.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: EVP_des_ecb()
      - pattern: EVP_des_cbc()
      - pattern: EVP_des_ede3_cbc()


  # --- RC4 encryption ---
  - id: cpp-crypto-rc4
    languages: [c, cpp]
    severity: WARNING
    message: >-
      RC4 encryption used. RC4 is broken: bias in the first output bytes
      allows plaintext recovery. Use ChaCha20 or AES-CTR.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: EVP_rc4()


  # --- MD5 for security ---
  - id: cpp-crypto-md5-security
    languages: [c, cpp]
    severity: WARNING
    message: >-
      MD5 used in a security context (password hashing, integrity,
      signatures). MD5 is broken: collision attacks cost seconds on a
      laptop. Use SHA-256 or SHA-3. For passwords, use argon2/bcrypt/scrypt.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: MD5(...)
      - pattern: EVP_md5()


  # --- SHA1 for security ---
  - id: cpp-crypto-sha1-security
    languages: [c, cpp]
    severity: WARNING
    message: >-
      SHA-1 used in a security context (signatures, certificates, integrity).
      SHA-1 has practical collision attacks (SHAttered). Use SHA-256/SHA-3.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: SHA1(...)
      - pattern: EVP_sha1()


  # --- hardcoded encryption keys ---
  - id: cpp-crypto-hardcoded-key
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Hardcoded encryption key or IV in source code. Static keys are
      extractable from the binary and provide no real security. Use a
      key derivation function (PBKDF2, Argon2) from user credentials,
      or read the key from a secure store at runtime.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hardcoded Credentials"
      vuln-research-domain: crypto
      confidence: LOW
    patterns:
      - pattern: |
          unsigned char $KEY[] = "...";


  # --- strcmp/memcmp for password comparison ---
  - id: cpp-crypto-const-time-compare
    languages: [c, cpp]
    severity: WARNING
    message: >-
      strcmp() or memcmp() used to compare passwords or HMACs.
      String comparison is not constant-time: it exits on the first
      mismatching byte, allowing timing attacks. Use a constant-time
      comparison function (crypto_memcmp, CRYPTO_memcmp, or
      sodium_memcmp).
    metadata:
      category: security
      cwe: "CWE-208: Observable Timing Discrepancy"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: strcmp($PASSWORD, $INPUT)
      - pattern: memcmp($PASSWORD, $INPUT, $LEN)


  # --- EVP_EncryptInit without auth tag ---
  - id: cpp-crypto-evp-encryptinit-no-auth
    languages: [c, cpp]
    severity: WARNING
    message: >-
      EVP_EncryptInit_ex with a cipher mode that does not provide
      authentication (e.g., CBC, CTR without HMAC). Unauthenticated
      encryption is malleable and can be altered without detection.
      Use AEAD mode (GCM, CCM, Chacha20-Poly1305) or add a MAC.
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: EVP_EncryptInit_ex($CTX, $CIPHER, ...)


  # --- CBC without MAC ---
  - id: cpp-crypto-cbc-without-mac
    languages: [c, cpp]
    severity: WARNING
    message: >-
      CBC mode encryption without a MAC. CBC is malleable: an attacker
      can flip bits in ciphertext to cause predictable changes in
      plaintext (padding oracle attacks). Always use encrypt-then-MAC
      or switch to GCM/CCM.
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: EVP_aes_256_cbc()


  # --- ECB mode ---
  - id: cpp-crypto-ecb-mode
    languages: [c, cpp]
    severity: WARNING
    message: >-
      ECB mode encryption. ECB encrypts each block independently,
      so identical plaintext blocks produce identical ciphertext blocks.
      This leaks plaintext structure (e.g., in images, the silhouette
      remains visible). Use CBC or CTR with a random IV.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: EVP_aes_256_ecb()
      - pattern: EVP_des_ecb()


  # --- RSA_verify without padding check ---
  - id: cpp-crypto-rsa-verify-no-padding
    languages: [c, cpp]
    severity: ERROR
    message: >-
      RSA_verify(NID_undef, ...) or RSA_verify with PKCS#1 v1.5 without
      checking the padding structure. Unvalidated padding may allow
      Bleichenbacher-style attacks. Use RSA_verify_PSS_mgf1 or
      RSA_verify with proper digest NID.
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: RSA_verify(NID_undef, ...)


  # --- SSL_get_verify_result not checked ---
  - id: cpp-crypto-ssl-verify-result-unchecked
    languages: [c, cpp]
    severity: ERROR
    message: >-
      SSL_get_verify_result() return value not checked. A failed
      certificate verification (expired, self-signed, wrong host)
      goes undetected, allowing man-in-the-middle attacks. Always
      check that the result is X509_V_OK.
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      vuln-research-domain: crypto
      confidence: HIGH
    patterns:
      - pattern: SSL_get_verify_result($SSL)
      - pattern-not: |
          if (SSL_get_verify_result($SSL) == X509_V_OK) ...


  # --- RAND_status not checked ---
  - id: cpp-crypto-rand-status-unchecked
    languages: [c, cpp]
    severity: WARNING
    message: >-
      RAND_status() not checked before generating cryptographic keys.
      If the RNG is not seeded, RAND_bytes may return predictable values.
      Always check RAND_status() == 1 before generating keys.
    metadata:
      category: security
      cwe: "CWE-330: Use of Insufficiently Random Values"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          if (RAND_status() == 1) { ... }
      - pattern: RAND_bytes($BUF, $SIZE);


  # --- RSA_generate_key with insufficient size ---
  - id: cpp-crypto-rsa-key-size
    languages: [c, cpp]
    severity: WARNING
    message: >-
      RSA_generate_key with modulus size < 2048 bits. Keys smaller than
      2048 bits are breakable with moderate resources (NIST SP 800-57).
      Use at least 2048 bits, preferably 3072 or 4096.
    metadata:
      category: security
      cwe: "CWE-326: Inadequate Encryption Strength"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: RSA_generate_key($NUM, ...)


  # --- HMAC with MD5/SHA1 ---
  - id: cpp-crypto-hmac-weak
    languages: [c, cpp]
    severity: WARNING
    message: >-
      HMAC with MD5 or SHA-1. Use HMAC-SHA256 or stronger.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: HMAC(EVP_md5(), ...)
      - pattern: HMAC(EVP_sha1(), ...)


  # --- DSA key generation ---
  - id: cpp-crypto-dsa-key-size
    languages: [c, cpp]
    severity: WARNING
    message: >-
      DSA_generate_key / DSA_generate_parameters_ex with insufficient
      key size. Use at least 2048-bit DSA or prefer ECDSA with
      P-256/P-384.
    metadata:
      category: security
      cwe: "CWE-326: Inadequate Encryption Strength"
      vuln-research-domain: crypto
      confidence: MEDIUM
    patterns:
      - pattern: DSA_generate_key(...)


  # ============================================================================
  # §13  NETWORK
  # ============================================================================
  #
  # Rules for network API misuse, socket lifecycle, and protocol pitfalls.
  # ---------------------------------------------------------------------------

  # --- recv with length vs buffer mismatch ---
  - id: cpp-network-recv-length-mismatch
    languages: [c, cpp]
    severity: ERROR
    message: >-
      recv(sock, buf, len, flags) where len may exceed buf allocation.
      Validate len <= sizeof(buf).
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: network
      confidence: HIGH
    patterns:
      - pattern: recv($SOCK, $BUF, $LEN, ...)


  # --- send with unchecked buffer length ---
  - id: cpp-network-send-length-mismatch
    languages: [c, cpp]
    severity: WARNING
    message: >-
      send(sock, buf, len, flags) where len may exceed valid data in buf.
      If len is larger than the amount of data actually in buf,
      uninitialized memory is sent (info leak). Validate len against
      the actual data size.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: send($SOCK, $BUF, $LEN, ...)


  # --- accept without checking return ---
  - id: cpp-network-accept-unchecked
    languages: [c, cpp]
    severity: WARNING
    message: >-
      accept() return not checked. If accept fails (returns -1/
      INVALID_SOCKET), subsequent operations on the returned fd cause
      errors or undefined behavior. Always check accept() for error
      before using the socket.
    metadata:
      category: security
      cwe: "CWE-252: Unchecked Return Value"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: accept(...)
      - pattern-not: |
          if (($SOCK = accept(...)) >= 0) ...
      - pattern-not: |
          if (($SOCK = accept(...)) != -1) ...


  # --- connect with hardcoded credentials ---
  - id: cpp-network-connect-hardcoded-creds
    languages: [c, cpp]
    severity: WARNING
    message: >-
      connect() to a hardcoded IP address or with hardcoded credentials.
      Hardcoded connection parameters make the program brittle and may
      embed authentication secrets. Externalize connection configuration.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hardcoded Credentials"
      vuln-research-domain: network
      confidence: LOW
    patterns:
      - pattern: connect($SOCK, ...)


  # --- bind to INADDR_ANY ---
  - id: cpp-network-bind-inaddr-any
    languages: [c, cpp]
    severity: WARNING
    message: >-
      bind() with INADDR_ANY (0.0.0.0) binds to all network interfaces.
      If the service should only be accessible on localhost, use
      inet_addr("127.0.0.1") or htonl(INADDR_LOOPBACK). Binding to
      all interfaces exposes the service to the network.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: network
      confidence: MEDIUM
    pattern: bind($SOCK, ..., INADDR_ANY, ...);


  # --- listen with backlog 0 ---
  - id: cpp-network-listen-backlog-zero
    languages: [c, cpp]
    severity: WARNING
    message: >-
      listen(sock, backlog) with backlog = 0. Behavior is platform-
      dependent: on Linux, backlog of 0 means no connections are
      accepted (SYN packets get RST). Use at least SOMAXCONN for the
      backlog.
    metadata:
      category: security
      cwe: "CWE-670: Incorrect Implementation"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: listen($SOCK, 0)


  # --- select FD_SET overflow ---
  - id: cpp-network-fd-set-overflow
    languages: [c, cpp]
    severity: WARNING
    message: >-
      FD_SET(fd, set) where fd >= FD_SETSIZE (typically 1024). This
      writes past the fd_set structure, corrupting adjacent memory.
      Use poll() or epoll() instead for large FDs, or check fd < FD_SETSIZE
      before FD_SET.
    metadata:
      category: security
      cwe: "CWE-787: Out-of-bounds Write"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: FD_SET($FD, $SET)


  # --- poll with user-controlled timeout ---
  - id: cpp-network-poll-user-timeout
    languages: [c, cpp]
    severity: WARNING
    message: >-
      poll(fds, nfds, timeout) with user-controlled timeout. A large
      timeout can block the thread indefinitely (DoS). Cap the timeout
      to a reasonable maximum.
    metadata:
      category: security
      cwe: "CWE-770: Allocation of Resources Without Limits"
      vuln-research-domain: network
      confidence: LOW
    patterns:
      - pattern: poll($FDS, $NFDS, $TIMEOUT)


  # --- recvfrom without checking source ---
  - id: cpp-network-recvfrom-no-source-check
    languages: [c, cpp]
    severity: WARNING
    message: >-
      recvfrom() without validating the source address. If the socket is
      bound to INADDR_ANY, packets from any source are accepted. Validate
      that the source address matches an expected peer.
    metadata:
      category: security
      cwe: "CWE-923: Improper Restriction of Communication Channel"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: recvfrom($SOCK, $BUF, $LEN, $FLAGS, $SRC, $SRCLEN)


  # --- unchecked bind return ---
  - id: cpp-network-bind-return-unchecked
    languages: [c, cpp]
    severity: WARNING
    message: >-
      bind() return not checked. If bind fails (port already in use,
      insufficient privileges, etc.), the socket is not bound and
      subsequent listen/accept will fail unexpectedly. Always check
      bind() == 0.
    metadata:
      category: security
      cwe: "CWE-252: Unchecked Return Value"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: bind($SOCK, ...)


  # --- getsockname/getpeername insufficient buffer ---
  - id: cpp-network-getsockname-buffer-size
    languages: [c, cpp]
    severity: WARNING
    message: >-
      getsockname() / getpeername() with a sockaddr buffer that may be
      too small for the address family (e.g., sockaddr_storage for IPv6).
      If the address is IPv6, a sockaddr_in buffer overflows. Use
      sockaddr_storage for protocol-family agnostic code.
    metadata:
      category: security
      cwe: "CWE-120: Buffer Copy without Checking Size of Input"
      vuln-research-domain: network
      confidence: MEDIUM
    pattern-either:
      - pattern: getsockname($SOCK, ...)
      - pattern: getpeername($SOCK, ...)


  # --- dup2 without checking return ---
  - id: cpp-network-dup2-unchecked
    languages: [c, cpp]
    severity: WARNING
    message: >-
      dup2(oldfd, newfd) return not checked. If dup2 fails (e.g., oldfd
      is invalid), newfd remains open, potentially leaking file descriptors
      to child processes. Always check dup2() == newfd or >= 0.
    metadata:
      category: security
      cwe: "CWE-252: Unchecked Return Value"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: dup2($OLD, $NEW)
      - pattern-not: |
          if (dup2($OLD, $NEW) < 0) ...
      - pattern-not: |
          if (dup2($OLD, $NEW) == -1) ...


  # --- fcntl setting flags without checking return ---
  - id: cpp-network-fcntl-unchecked
    languages: [c, cpp]
    severity: WARNING
    message: >-
      fcntl(fd, F_SETFL, flags) return not checked. If fcntl fails,
      the flags (e.g., O_NONBLOCK) are not set, potentially causing
      blocking operations where non-blocking was expected (DoS or
      hang).
    metadata:
      category: security
      cwe: "CWE-252: Unchecked Return Value"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: fcntl($FD, F_SETFL, ...)
      - pattern-not: |
          if (fcntl($FD, F_SETFL, ...) < 0) ...


  # --- ioctl with user-controlled request ---
  - id: cpp-network-ioctl-user-request
    languages: [c, cpp]
    severity: WARNING
    message: >-
      ioctl(fd, request, ...) where request is derived from user input.
      An attacker can issue arbitrary device control operations, leading
      to privilege escalation or system compromise. Validate the request
      code against a whitelist.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: network
      confidence: MEDIUM
    patterns:
      - pattern: ioctl($FD, $REQUEST, ...)


  # --- shutdown missing ---
  - id: cpp-network-shutdown-missing
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Socket closed with close()/closesocket() without prior shutdown().
      On some platforms, close() may not immediately tear down the
      connection, and data in the receive buffer may be lost. Use
      shutdown(sock, SHUT_RDWR) before close().
    metadata:
      category: security
      cwe: "CWE-404: Improper Resource Shutdown"
      vuln-research-domain: network
      confidence: LOW
    patterns:
      - pattern: close($SOCK)
      - pattern: closesocket($SOCK)


  # ============================================================================
  # §14  RESOURCE LEAKS
  # ============================================================================
  #
  # Rules for file handles, sockets, memory, and other resources that
  # must be released after acquisition.
  # ---------------------------------------------------------------------------

  # --- fopen without fclose ---
  - id: cpp-resource-leak-fopen-no-close
    languages: [c, cpp]
    severity: WARNING
    message: >-
      fopen() opened a file but fclose() is not called in all exit paths.
      In long-running processes, leaked file descriptors exhaust the
      process file descriptor limit and prevent other operations.
      Use RAII wrappers (std::fstream) or ensure fclose in cleanup code.
    metadata:
      category: security
      cwe: "CWE-775: Missing Release of File Descriptor or Handle"
      vuln-research-domain: resource-leak
      confidence: MEDIUM
    patterns:
