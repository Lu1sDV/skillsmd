      - pattern: unlink($PATH)
      - pattern: rmdir($PATH)


  # --- execve/execvp/execl with user path ---
  - id: cpp-env-exec-user-path
    languages: [c, cpp]
    severity: ERROR
    message: >-
      exec* with a user-controlled path. An attacker can execute arbitrary
      binaries. Use a whitelist of allowed paths.
