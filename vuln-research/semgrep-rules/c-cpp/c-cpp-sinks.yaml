      cleanup would have freed memory, subsequent code may access freed
      memory (use-after-free). Use exception handling or ensure no
      resources are held across setjmp/longjmp.
    metadata:
      category: security
      cwe: "CWE-562: Return of Stack Variable Address"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: longjmp($ENV, $VAL)


