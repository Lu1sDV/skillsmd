  # ============================================================================
  # §4  USE-AFTER-FREE / LIFECYCLE
  # ============================================================================
  #
  # 0xdea already covers: free then read/write, double free, free on stack,
  # free on non-heap, mismatched alloc/dealloc (malloc+delete, new+free),
  # new/delete[] mismatch.
  #
  # This section adds C++ STL iterator/container invalidation patterns,
  # smart pointer misuse, realloc edge cases, signal handler restrictions,
  # and resource-free lifecycle bugs.
  # ---------------------------------------------------------------------------

  # --- std::vector push_back invalidates references/iterators ---
  - id: cpp-use-after-free-vector-pushback-invalidation
    languages: [cpp]
    severity: WARNING
    message: >-
      Storing a reference or pointer to a vector element, then calling
      push_back() / insert() / emplace_back() may invalidate all
      references, pointers, and iterators due to reallocation. Accessing
      the old reference after modification is use-after-free. Reserve
      capacity in advance or use index-based access.
    metadata:
      category: security
      cwe: "CWE-416: Use After Free"
      vuln-research-domain: use-after-free
      confidence: MEDIUM
    patterns:
      - pattern: |
          $TYPE &$REF = $VECTOR[$IDX];
          ...
          $VECTOR.push_back(...);


  - id: cpp-use-after-free-vector-iterator-invalidation
    languages: [cpp]
    severity: WARNING
    message: >-
      Iterator into a vector that is subsequently modified via push_back,
      insert, or erase. Vector reallocation invalidates all iterators.
      Accessing through the old iterator after modification is
      use-after-free. Re-obtain the iterator after modification.
    metadata:
      category: security
      cwe: "CWE-416: Use After Free"
      vuln-research-domain: use-after-free
      confidence: MEDIUM
    patterns:
      - pattern: |
          auto $IT = std::begin($VECTOR);
          ...
          $VECTOR.erase($IT2);


  # --- std::string c_str/data invalidation after modification ---
  - id: cpp-use-after-free-string-cstr-after-modify
    languages: [cpp]
    severity: WARNING
    message: >-
      std::string::c_str() or data() pointer is invalidated by any
      non-const operation on the string (append, insert, replace, +,
      resize, etc.). Storing the pointer and using it after modification
      is use-after-free. Avoid storing c_str() results across string
      modifications.
    metadata:
      category: security
      cwe: "CWE-416: Use After Free"
      vuln-research-domain: use-after-free
      confidence: MEDIUM
    patterns:
      - pattern: |
          const char *$P = $STR.c_str();
          ...
          $STR.$FUNC(...);
      - pattern: |
          const wchar_t *$P = $STR.c_str();
          ...
          $STR.$FUNC(...);


