  #
  # Remaining high-value sinks from the Flawfinder/GitLab cross-reference
  # that do not fit neatly into the other categories.
  # ---------------------------------------------------------------------------

  - id: cpp-error-handling-initializecriticalsection
    languages: [c, cpp]
    severity: WARNING
    message: >-
      InitializeCriticalSection() can raise an exception (STATUS_NO_MEMORY)
      in low-memory conditions on Windows 2000/XP. Use
      InitializeCriticalSectionAndSpinCount() or
      InitializeCriticalSectionEx() which return an error code instead.
    metadata:
      category: security
      cwe: "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      vuln-research-domain: error-handling
      confidence: MEDIUM
    patterns:
      - pattern: InitializeCriticalSection($LPCS)


  - id: cpp-input-validation-mismatch
    languages: [c, cpp]
    severity: WARNING
    message: >-
      std::mismatch() returns the first position where two ranges differ.
      If the second range is shorter than the first, the behavior is
      undefined (out-of-bounds read). Ensure the second range is at least
      as long as the first before calling.
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      vuln-research-domain: input-validation
      confidence: MEDIUM
    patterns:
      - pattern: mismatch($BEG1, $END1, $BEG2)


  - id: cpp-input-validation-is-permutation
    languages: [c, cpp]
    severity: WARNING
    message: >-
      std::is_permutation() compares two ranges. If the second range is
      shorter, the behavior is undefined (out-of-bounds read). Ensure
      the second range is at least as long as the first.
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      vuln-research-domain: input-validation
      confidence: MEDIUM
    patterns:
      - pattern: is_permutation($BEG1, $END1, $BEG2)


  - id: cpp-network-input-recvmsg
    languages: [c, cpp]
    severity: WARNING
    message: >-
      recvmsg() receives a message from a socket. If msg_iov[i].iov_len is
      incorrectly sized or msg_control is too small for the ancillary data,
      the destination buffer overflows or data leaks. Validate the lengths
      against actual buffer allocations.
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      vuln-research-domain: network-input
      confidence: MEDIUM
    patterns:
      - pattern: recvmsg($SOCK, $MSG, $FLAGS)


  - id: cpp-command-injection-popen
    languages: [c, cpp]
    severity: ERROR
    message: >-
      popen() executes a shell command. If the command string contains
      user-controlled data, an attacker can execute arbitrary shell
      commands. Use posix_spawn() with separate arguments or validate
      and sanitize the command thoroughly.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      vuln-research-domain: command-injection
      confidence: MEDIUM
    patterns:
      - pattern: popen($CMD, $MODE)
