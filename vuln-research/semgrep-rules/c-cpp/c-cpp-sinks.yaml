  # --- unordered_map hash flooding (ReDoS via hash collision) ---
  - id: cpp-stl-unordered-map-hash-flooding
    languages: [cpp]
    severity: WARNING
    message: >-
      std::unordered_map with user-controlled keys is vulnerable to
      hash collision attacks (hash flooding). An attacker can craft
      many keys that hash to the same bucket, degrading insertion/
      lookup to O(n) and causing DoS. Use a random seed for the hash
      or a map with resistance to collisions.
    metadata:
      category: security
      cwe: "CWE-400: Uncontrolled Resource Consumption"
      vuln-research-domain: cpp-stl
      confidence: LOW
    patterns:
      - pattern: std::unordered_map<$TYPE1, $TYPE2> $MAP;


  # --- list splice iterator invalidation ---
  - id: cpp-stl-list-splice-invalidation
    languages: [cpp]
    severity: WARNING
    message: >-
      std::list::splice() moves elements but does not invalidate
      iterators to the moved elements (they remain valid and now
      refer to elements in the destination list). However, if the
      source list is destroyed or the elements are further modified,
      the iterators become dangling. Be careful with iterator lifetimes
      across splice operations.
    metadata:
      category: security
      cwe: "CWE-416: Use After Free"
      vuln-research-domain: cpp-stl
      confidence: LOW
    patterns:
      - pattern: $LIST1.splice($POS, $LIST2, ...)


  # --- sort with unstable comparator ---
  - id: cpp-stl-sort-unstable-comparator
    languages: [cpp]
    severity: WARNING
    message: >-
      std::sort with a comparator that does not establish a strict weak
      ordering (e.g., returns true for equal elements, or is inconsistent).
      This is undefined behavior and can cause out-of-bounds access or
      infinite loops. Ensure the comparator is irreflexive, antisymmetric,
      and transitive.
    metadata:
      category: security
      cwe: "CWE-670: Incorrect Implementation"
      vuln-research-domain: cpp-stl
      confidence: LOW
    patterns:
      - pattern: std::sort($FIRST, $LAST, $COMP)


  # --- binary_search on unsorted range ---
  - id: cpp-stl-binary-search-unsorted
    languages: [cpp]
    severity: WARNING
    message: >-
      std::binary_search / std::lower_bound / std::upper_bound on a
      range that may not be sorted. Binary search on unsorted data
      produces incorrect results (may not find elements that are present,
      or may find elements at wrong positions). Ensure the range is
      sorted before using binary search algorithms.
    metadata:
      category: security
      cwe: "CWE-670: Incorrect Implementation"
      vuln-research-domain: cpp-stl
      confidence: LOW
    pattern-either:
      - pattern: std::binary_search($FIRST, $LAST, $VAL)
      - pattern: std::lower_bound($FIRST, $LAST, $VAL)
      - pattern: std::upper_bound($FIRST, $LAST, $VAL)


  # --- equal on different-length ranges ---
  - id: cpp-stl-equal-different-length
    languages: [cpp]
    severity: WARNING
    message: >-
      std::equal(first1, last1, first2) only checks that first2 has at
      least (last1 - first1) elements. If the second range is shorter,
      std::equal reads past its end (buffer over-read). Use the
      C++14 four-argument overload: std::equal(first1, last1, first2, last2).
    metadata:
      category: security
      cwe: "CWE-787: Out-of-bounds Write"
      vuln-research-domain: cpp-stl
      confidence: MEDIUM
    patterns:
      - pattern: std::equal($F1, $L1, $F2)
      - pattern-not: std::equal($F1, $L1, $F2, $L2)


  # --- transform with side effects ---
  - id: cpp-stl-transform-side-effects
    languages: [cpp]
    severity: WARNING
    message: >-
      std::transform with a callable that has side effects. The order
      of application is unspecified — if the unary operation has
      visible side effects, the result is unpredictable. Use
      std::for_each for operations with side effects.
    metadata:
      category: security
      cwe: "CWE-670: Incorrect Implementation"
      vuln-research-domain: cpp-stl
      confidence: LOW
    patterns:
      - pattern: std::transform($F1, $L1, $DEST, $OP)


  # --- remove without erase (erase-remove idiom) ---
  - id: cpp-stl-remove-without-erase
    languages: [cpp]
    severity: WARNING
    message: >-
      std::remove / std::remove_if without std::erase. remove shifts
      elements but does NOT reduce the container size — the "removed"
      elements remain at the end as garbage. Accessing the remaining
      elements or using the container size is incorrect. Always follow
      remove with erase: container.erase(std::remove(...), container.end()).
