      variable. The returned directory may be attacker-controlled. Use
      with care in setuid or sandbox contexts.
    metadata:
      category: security
      cwe: "CWE-807: Reliance on Untrusted Inputs in a Security Decision"
      vuln-research-domain: untrusted-input
      confidence: MEDIUM
    patterns:
      - pattern: g_get_tmp_dir()


  - id: cpp-untrusted-input-getopt
    languages: [c, cpp]
    severity: WARNING
    message: >-
      getopt() parses command-line options from argv. If arguments are
      user-controlled (e.g., via CGI or SUID binary), an attacker can
      inject unexpected options causing logic bypass or buffer over-read.
      Sanitise argument sources.
    metadata:
      category: security
      cwe: "CWE-807: Reliance on Untrusted Inputs in a Security Decision"
      vuln-research-domain: untrusted-input
