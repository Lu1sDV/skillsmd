      values can cause wraparound, leading to out-of-bounds access.
      Use _FILE_OFFSET_BITS=64 and validate arithmetic.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: LOW
    patterns:
      - pattern: lseek($FD, $OFFSET, $WHENCE)


  # --- ptrdiff_t overflow ---
  - id: cpp-integer-overflow-ptrdiff-t-overflow
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Subtracting two pointers from different objects or with very large
      distance can overflow ptrdiff_t (signed). The result is undefined
      behavior per the C standard. Ensure pointers point within the same
      object and the distance fits in ptrdiff_t.
    metadata:
      category: security
      cwe: "CWE-469: Use of Pointer Subtraction to Determine Size"
      vuln-research-domain: integer-overflow
      confidence: LOW
    patterns:
      - pattern: $PTR1 - $PTR2


  # --- int overflow in array index ---
  - id: cpp-integer-overflow-int-index-overflow
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Signed integer used as array index. If the index value wraps
      (e.g., on increment beyond INT_MAX), it may become negative or
      small, accessing memory before the array. Use size_t for indices
      and validate ranges.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: $BUF[$INT_EXPR]


  # --- numeric conversion truncation (explicit case) ---
  - id: cpp-integer-overflow-conversion-truncation
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Casting a larger integer type to a smaller one truncates the value.
      If the original value exceeds the smaller type's range, the MSBs
      are silently discarded, producing an incorrect value. Validate the
      value is within range before casting.
    metadata:
      category: security
      cwe: "CWE-197: Numeric Truncation Error"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: ($TYPE)($EXPR)


  # for loop with signed counter and unsigned bound
  - id: cpp-integer-overflow-signed-counter-unsigned-bound
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Loop with a signed counter compared against an unsigned bound.
      If the signed counter overflows (e.g., decrementing below 0),
      it wraps to a large positive value. Use the same signedness for
      counter and bound.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: |
          for (int $I = 0; $I < $SIZE_T_VAL; $I++) { ... }


  # --- shift by >= width ---
  - id: cpp-integer-overflow-shift-too-wide
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Shift by a value greater than or equal to the bit width of the type.
      This is undefined behavior per the C/C++ standard. The result is
      unpredictable and compiler-dependent. Validate the shift amount
      or use a bitmask on the RHS.
    metadata:
      category: security
      cwe: "CWE-682: Incorrect Calculation"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: $VAL << $SHIFT
      - pattern: $VAL >> $SHIFT


  # --- operator precedence: & and == ---
  - id: cpp-integer-overflow-precedence-bitand-eq
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Bitwise AND (&) has lower precedence than equality (==). The
      expression (flags & MASK == value) is parsed as
      (flags & (MASK == value)), which is almost certainly wrong.
      Add parentheses: (flags & MASK) == value.
    metadata:
      category: security
      cwe: "CWE-783: Operator Precedence Logic Error"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: $X & $Y == $Z
      - pattern: $X & $Y != $Z


  # --- strict aliasing violation ---
  - id: cpp-integer-overflow-strict-aliasing
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Dereferencing a pointer cast to an incompatible type violates the
      strict aliasing rule (C99 §6.5). The compiler may generate incorrect
      code due to assumed non-aliasing. Use memcpy() or std::bit_cast to
      type-pun safely, or compile with -fno-strict-aliasing.
    metadata:
      category: security
      cwe: "CWE-843: Type Confusion"
      vuln-research-domain: integer-overflow
      confidence: LOW
    patterns:
      - pattern: "*($TYPE2 *)$PTR1"


  # --- signed left shift of negative value ---
  - id: cpp-integer-overflow-signed-shift-negative
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Left-shifting a signed negative integer is undefined behavior in
      C++11 and earlier, and implementation-defined in later standards.
      Use unsigned types for bitwise operations.
    metadata:
      category: security
      cwe: "CWE-682: Incorrect Calculation"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: -$VAL << $SHIFT


  # --- Division by zero via tainted input ---
  - id: cpp-integer-overflow-division-by-zero
    languages: [c, cpp]
    severity: ERROR
    message: >-
      Integer division (a / b) or modulo (a % b) where b is tainted or
      not validated. If b is zero, the program crashes with SIGFPE
      (floating point exception). Validate b != 0 before the operation.
    metadata:
      category: security
      cwe: "CWE-369: Divide By Zero"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: $A / $B
      - pattern: $A % $B


  # --- unsigned integer wraparound in loop condition ---
  - id: cpp-integer-overflow-unsigned-loop-underflow
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Loop decrementing an unsigned counter: for (size_t i = n-1; i >= 0; i--).
      The condition i >= 0 is always true for unsigned types. When i wraps
      from 0 to SIZE_MAX, the loop runs forever or accesses memory far
      out of bounds. Use signed types or check for 'i != (size_t)-1'.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: |
          for (size_t $I = ...; $I >= 0; $I--) { ... }


  # --- integer promotion error ---
  - id: cpp-integer-overflow-promotion-bug
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Operations on types smaller than int undergo integer promotion.
      uint16_t a, b; uint32_t c = a * b; — the multiplication is done
      in int (signed) before widening to uint32_t, and overflow in int
      is undefined behavior. Cast operands to the wider type first.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: LOW
    patterns:
      - pattern: |
          uint16_t $A = ...;
          ...
          uint16_t $B = ...;
          ...


  # --- malloc with negative int cast to size_t ---
  - id: cpp-integer-overflow-malloc-negative-int
    languages: [c, cpp]
    severity: ERROR
    message: >-
      malloc() with a signed int argument. If the int is negative,
      it is implicitly cast to a very large size_t, causing malloc to
      fail (return NULL) or allocate an enormous block. Validate the
      argument is non-negative and within reasonable bounds.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: HIGH
    patterns:
      - pattern: malloc($INT_VAL)


  # ============================================================================
  # §6  TOCTOU / RACE / PRIVILEGE / ENVIRONMENT
  # ============================================================================
  #
  # 0xdea already covers: access/stat/lstat before use, mktemp/tmpnam/tempnam,
  # signal() vs sigaction(), setuid/setgid wrong order, unchecked
  # setuid/seteuid, putenv with stack var.
  #
  # This section adds file-operation TOCTOU patterns, privilege-dropping
  # edge cases, environment variable handling, and capabilities/sandboxing.
  # ---------------------------------------------------------------------------

  # --- stat then open (TOCTOU) ---
  - id: cpp-toctou-stat-then-open
    languages: [c, cpp]
    severity: WARNING
    message: >-
      stat(path, ...) followed by open(path, ...). Between the check and
      the use, the file at path could be replaced by an attacker (TOCTOU).
      Perform the open() first, then use fstat() on the fd for atomicity.
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: |
          stat($PATH, $BUF);
          ...
          open($PATH, ...);


  - id: cpp-toctou-lstat-then-open
    languages: [c, cpp]
    severity: WARNING
    message: >-
      lstat(path, ...) followed by open(path, ...). Symlink can be swapped
      between check and use. Use open() then fstat().
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: |
          lstat($PATH, $BUF);
          ...
          open($PATH, ...);


  # --- O_CREAT without O_EXCL ---
  - id: cpp-toctou-open-creat-without-excl
    languages: [c, cpp]
    severity: WARNING
    message: >-
      open(path, O_CREAT | O_WRONLY, mode) without O_EXCL. An attacker
      can create a symlink at path before the open, causing the file to
      be created at the target of the symlink (e.g., overwriting /etc/passwd).
      Add O_EXCL or use O_CREAT | O_EXCL for new files.
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: open($PATH, $FLAGS | O_CREAT, ...)
      - pattern-not: open($PATH, $FLAGS | O_CREAT | O_EXCL, ...)
      - pattern-not: open($PATH, $FLAGS | O_EXCL | O_CREAT, ...)


  # --- fopen "w" without exclusive creation ---
  - id: cpp-toctou-fopen-w-no-excl
    languages: [c, cpp]
    severity: WARNING
    message: >-
      fopen(path, "w") opens an existing file for writing without atomic
      exclusive creation. An attacker can replace the file with a symlink.
      Use open() with O_CREAT | O_EXCL and then fdopen(), or use the "wx"
      mode in C11.
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: fopen($PATH, "w")
      - pattern: fopen($PATH, "wb")


  # --- rename TOCTOU on shared directory ---
  - id: cpp-toctou-rename-nfs
    languages: [c, cpp]
    severity: WARNING
    message: >-
      rename(src, dst) in a shared directory or on NFS is not atomic.
      An attacker can substitute src after the rename completes but
      before dst is accessed. Use link() followed by unlink(), or use
      renameat2() with RENAME_EXCHANGE.
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: toctou
      confidence: LOW
    patterns:
      - pattern: rename($SRC, $DST)


  # --- chroot without chdir ---
  - id: cpp-toctou-chroot-without-chdir
    languages: [c, cpp]
    severity: ERROR
    message: >-
      chroot(path) without a preceding chdir(path). After chroot, the
      current working directory may still be outside the new root if it
      was not changed before the chroot call. An attacker can use
      relative paths like ../../etc/passwd to escape the chroot jail.
    metadata:
      category: security
      cwe: "CWE-243: Changing Working Directory Not Changed"
      vuln-research-domain: toctou
      confidence: HIGH
    patterns:
      - pattern: |
          chroot($PATH);
          ...
      - pattern-not: |
          chdir($PATH);
          chroot($PATH);
          ...
      - pattern-not: |
          chroot("...");
          chdir("...");


  # --- tmpfile race ---
  - id: cpp-toctou-tmpfile-race
    languages: [c, cpp]
    severity: WARNING
    message: >-
      tmpfile() creates a temporary file that is deleted on close. In
      some implementations, the filename is predictable, allowing an
      attacker to create a symlink before the open. Use mkstemp() or
      tmpfile_s() if available.
    metadata:
      category: security
      cwe: "CWE-377: Insecure Temporary File"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: tmpfile()


  # --- mkstemp without umask ---
  - id: cpp-toctou-mkstemp-without-umask
    languages: [c, cpp]
    severity: WARNING
    message: >-
      mkstemp(template) creates a temp file with permissions 0600 minus
      umask. If umask is 0 (or too permissive), the temp file may be
      world-readable. Call umask(077) before mkstemp or explicitly set
      permissions with fchmod() after creation.
    metadata:
      category: security
      cwe: "CWE-377: Insecure Temporary File"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: mkstemp($TEMPLATE)


  # --- mkstemp without unlink ---
  - id: cpp-toctou-mkstemp-without-unlink
    languages: [c, cpp]
    severity: WARNING
    message: >-
      mkstemp() creates a temp file that persists on disk after the
      program exits unless unlink() is called immediately after open.
      In long-running daemons, this fills /tmp. Call unlink() on the
      fd right after mkstemp.
    metadata:
      category: security
      cwe: "CWE-377: Insecure Temporary File"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: mkstemp($TEMPLATE)


  # --- O_CREAT without O_EXCL in shared dir ---
  - id: cpp-toctou-creat-without-excl-shared
    languages: [c, cpp]
    severity: WARNING
    message: >-
      open(path, O_CREAT | O_RDWR, mode) in a shared/writable directory
      without O_EXCL. Attacker can use a symlink to redirect file creation
      to an arbitrary location (symlink following). Always include O_EXCL.
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: open($PATH, O_CREAT | O_RDWR, $MODE)


  # --- setresuid/setresgid wrong order ---
  - id: cpp-race-setresuid-setresgid-order
    languages: [c, cpp]
    severity: ERROR
    message: >-
      setresuid/setresgid should be called in the correct order to avoid
      privilege escalation. Typically, set the real UID last. If setresuid
      is called before setresgid, and the process has saved UID 0 but
      needs group privileges, the group change may fail. Always set
      group before user when dropping privileges.
    metadata:
      category: security
      cwe: "CWE-696: Incorrect Order of Operations"
      vuln-research-domain: race
      confidence: MEDIUM
    patterns:
      - pattern: |
          setresuid(...);
          setresgid(...);


  - id: cpp-race-setreuid-setregid-order
    languages: [c, cpp]
    severity: ERROR
    message: >-
      setreuid/setregid ordering. When permanently dropping privileges,
      set the GID before the UID so the process can still change groups
      if needed. Reverse order can leave the process with unprivileged
      UID but privileged GID (if setregid fails after UID drop).
    metadata:
      category: security
      cwe: "CWE-696: Incorrect Order of Operations"
      vuln-research-domain: race
      confidence: MEDIUM
    patterns:
      - pattern: |
          setreuid(...);
          setregid(...);


  # --- initgroups before setgid ---
  - id: cpp-race-initgroups-before-setgid
    languages: [c, cpp]
    severity: ERROR
    message: >-
      initgroups() or setgroups() called before setgid(). If the process
      still has root privileges, the supplementary group list is set
      correctly. After setgid(), the process may not have permission to
      set its supplementary groups. Call initgroups/setgroups first,
      then setgid/setuid.
    metadata:
      category: security
      cwe: "CWE-696: Incorrect Order of Operations"
      vuln-research-domain: race
      confidence: HIGH
    patterns:
      - pattern: |
          setgid($GID);
          ...
          initgroups(...);
      - pattern: |
          setgid($GID);
          ...
          setgroups(...);


  # --- prctl PR_SET_DUMPABLE ---
  - id: cpp-race-prctl-dumpable
    languages: [c, cpp]
    severity: WARNING
    message: >-
      prctl(PR_SET_DUMPABLE, 0) marks the process as non-dumpable,
      preventing core dumps that could leak sensitive data. Verify
      the return value (prctl can fail) and call it before processing
      sensitive data.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      vuln-research-domain: race
      confidence: MEDIUM
    patterns:
      - pattern: prctl(PR_SET_DUMPABLE, $VAL, ...)


  # --- capset/cap_set_proc unchecked ---
  - id: cpp-race-capset-unchecked
    languages: [c, cpp]
    severity: WARNING
    message: >-
      capset() or cap_set_proc() return not checked. If capability
      dropping fails (e.g., due to external process limits), the process
      retains more privileges than intended. Check the return value.
    metadata:
      category: security
      cwe: "CWE-273: Improper Check for Dropped Privileges"
      vuln-research-domain: race
      confidence: MEDIUM
    pattern-either:
      - pattern: capset(...)
      - pattern: cap_set_proc(...)


  # --- setgroups without initgroups ---
  - id: cpp-race-setgroups-without-initgroups
    languages: [c, cpp]
    severity: WARNING
    message: >-
      setgroups() called without first calling initgroups() to populate
      the group list from the group database. An empty group list may
      leave the process with fewer restrictions than intended, or may
      fail entirely. Call initgroups() first.
    metadata:
      category: security
      cwe: "CWE-696: Incorrect Order of Operations"
      vuln-research-domain: race
      confidence: MEDIUM
    patterns:
      - pattern: setgroups($SIZE, $LIST)


  # --- setuid before chroot ---
  - id: cpp-race-setuid-before-chroot
    languages: [c, cpp]
    severity: ERROR
    message: >-
      setuid() / setgid() called before chroot(). After chroot, the
      process drops privileges inside the jail. However, if setuid is
      called BEFORE chroot, the process may not have enough privileges
      to perform the chroot at all (requires CAP_SYS_CHROOT / root).
      Call chroot first, then drop privileges.
    metadata:
      category: security
      cwe: "CWE-696: Incorrect Order of Operations"
      vuln-research-domain: race
      confidence: HIGH
    patterns:
      - pattern: |
          setuid($UID);
          ...
          chroot($PATH);


  # --- setreuid/setregid with -1 ---
  - id: cpp-race-setreuid-minus-one
    languages: [c, cpp]
    severity: WARNING
    message: >-
      setreuid(-1, ...) or setregid(-1, ...) leaves the effective or
      real UID unchanged. This is not necessarily a bug but may indicate
      confusion about which IDs are being changed. When dropping
      privileges, make sure the change is complete.
    metadata:
      category: security
      cwe: "CWE-273: Improper Check for Dropped Privileges"
      vuln-research-domain: race
      confidence: LOW
    pattern-either:
      - pattern: setreuid(-1, ...)
      - pattern: setregid(-1, ...)


  # --- clone CLONE_NEWUSER (user namespace) ---
  - id: cpp-race-clone-newuser
    languages: [c, cpp]
    severity: WARNING
    message: >-
      clone() with CLONE_NEWUSER creates a new user namespace. Inside the
      namespace, the caller may have full capabilities mapped from the
      original UID. Ensure the UID/GID mapping is correctly set up and
      the child process drops privileges before accessing host resources.
    metadata:
      category: security
      cwe: "CWE-265: Privilege Issues"
      vuln-research-domain: race
      confidence: LOW
    patterns:
      - pattern: clone($FLAGS | CLONE_NEWUSER, ...)


  # --- unshare without privilege drop ---
  - id: cpp-race-unshare-no-priv-drop
    languages: [c, cpp]
    severity: WARNING
    message: >-
      unshare() disassociates parts of the process execution context.
      After unshare(CLONE_NEWUSER), the process still has the original
      UID/GID outside its namespace. Call setuid()/setgid() in the
      child or use prctl(PR_SET_KEEPCAPS) as appropriate.
    metadata:
      category: security
      cwe: "CWE-265: Privilege Issues"
      vuln-research-domain: race
      confidence: LOW
    patterns:
      - pattern: unshare($FLAGS)


  # --- getenv PATH in execvp ---
  - id: cpp-env-getenv-path-execvp
    languages: [c, cpp]
    severity: WARNING
    message: >-
      getenv("PATH") is implicitly used by execvp/execlp when the
      filename has no '/'. If PATH is attacker-controlled (e.g., via
      inherited environment in a setuid binary), a malicious binary
      under the attacker's PATH is executed. Set a fixed PATH before
      calling execvp, or use execve with an absolute path.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: execvp($FILE, $ARGV)


  - id: cpp-env-getenv-home
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Using getenv("HOME") to construct file paths. HOME is user-controlled
      and may point to an unexpected directory, causing the program to read
      or write files in attacker-controlled locations. Use getpwuid() to
      look up the user's home directory from the password database.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: getenv("HOME")
      - pattern: getenv("home")


  - id: cpp-env-getenv-ld-library-path
    languages: [c, cpp]
    severity: WARNING
    message: >-
      getenv("LD_LIBRARY_PATH") or getenv("LD_PRELOAD") in a setuid
      binary context. The dynamic linker ignores these for setuid
      programs on modern systems, but if the binary is not setuid but
      manages privileged operations, LD_PRELOAD can inject arbitrary
      code. Use secure_getenv() unconditionally.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: environment
      confidence: MEDIUM
    pattern-either:
      - pattern: getenv("LD_LIBRARY_PATH")
      - pattern: getenv("LD_PRELOAD")


  - id: cpp-env-getenv-ifs
    languages: [c, cpp]
    severity: WARNING
    message: >-
      getenv("IFS") (internal field separator) determines how the shell
      splits command arguments. If IFS is set to an unusual value, shell
      command parsing changes, potentially enabling injection. Validate
      or sanitize IFS, or avoid shell invocation entirely.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: environment
      confidence: LOW
    patterns:
      - pattern: getenv("IFS")


  - id: cpp-env-getenv-tmpdir
    languages: [c, cpp]
    severity: WARNING
    message: >-
      getenv("TMPDIR") or getenv("TMP") or getenv("TEMP") is user-
      controlled. If used to construct temp file paths, an attacker
      can redirect temp files to arbitrary locations. Validate the
      directory exists, is not a symlink, and has appropriate permissions.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: environment
      confidence: MEDIUM
    pattern-either:
      - pattern: getenv("TMPDIR")
      - pattern: getenv("TMP")
      - pattern: getenv("TEMP")


  - id: cpp-env-setenv-user-name
    languages: [c, cpp]
    severity: WARNING
    message: >-
      setenv()/putenv() with a name derived from user input. An attacker
      can set arbitrary environment variables, potentially influencing
      library loading (LD_PRELOAD), command execution (PATH), or other
      security-sensitive behavior. Validate the variable name against
      a whitelist.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: setenv($NAME, $VAL, $OVERWRITE)
      - pattern: putenv($STR)


  - id: cpp-env-unsetenv-setenv-race
    languages: [c, cpp]
    severity: WARNING
    message: >-
      unsetenv() followed by setenv() for the same variable is not atomic.
      In multithreaded programs, another thread may read the variable
      between the unset and set. Use setenv() with overwrite=1 instead.
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: environment
      confidence: LOW
    patterns:
      - pattern: |
          unsetenv($NAME);
          ...
          setenv($NAME, $VAL, ...);


  - id: cpp-env-getenv-vs-secure-getenv
    languages: [c, cpp]
    severity: WARNING
    message: >-
      getenv() used in a privileged context (setuid binary). Use
      secure_getenv() (or issetugid() on BSD) which returns NULL for
      dangerous environment variables when running with elevated
      privileges. getenv() respects all environment variables even
      in setuid binaries on some implementations.
    metadata:
      category: security
      cwe: "CWE-807: Untrusted Inputs in a Security Decision"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: getenv($VAR)


  # --- open with user path ---
  - id: cpp-env-open-user-path
    languages: [c, cpp]
    severity: WARNING
    message: >-
      open() called with a path derived from user input. An attacker may
      cause the program to open unintended files (path traversal) or
      follow symlinks. Validate the path resolves to an expected location
      using realpath() and a prefix check.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: open($PATH, ...)


  - id: cpp-env-fopen-user-path
    languages: [c, cpp]
    severity: WARNING
    message: >-
      fopen() called with a path from user input. Potential path traversal.
      Validate the path before use.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: fopen($PATH, ...)


  - id: cpp-env-chdir-user-path
    languages: [c, cpp]
    severity: WARNING
    message: >-
      chdir() with a user-controlled path. An attacker can change the
      working directory to an unexpected location, affecting subsequent
      relative path operations. Validate the path against a whitelist.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: chdir($PATH)


  # --- chroot escape via ../../ ---
  - id: cpp-env-chroot-escape
    languages: [c, cpp]
    severity: WARNING
    message: >-
      chroot() without immediately changing directory. If the current
      working directory is outside the new root (set before chroot),
      relative paths like ../../ may escape the jail. Always call
      chdir() immediately after chroot().
    metadata:
      category: security
      cwe: "CWE-243: Changing Working Directory Not Changed"
      vuln-research-domain: environment
      confidence: HIGH
    patterns:
      - pattern: |
          chdir($PATH);
          ...
          chroot($PATH);
          chdir("/");


  # --- symlink following ---
  - id: cpp-env-symlink-following
    languages: [c, cpp]
    severity: WARNING
    message: >-
      Opening a user-controlled path without O_NOFOLLOW. An attacker can
      create a symlink pointing to an arbitrary file, causing the program
      to open an unintended target. Use openat() with O_NOFOLLOW, or
      use O_PATH with stat to check the file type first.
    metadata:
      category: security
      cwe: "CWE-59: Improper Link Resolution Before File Access"
      vuln-research-domain: environment
      confidence: MEDIUM
    patterns:
      - pattern: open($PATH, $FLAGS)
      - pattern-not: open($PATH, O_NOFOLLOW | ...)
      - pattern-not: open($PATH, ... | O_NOFOLLOW)


  # --- realpath TOCTOU ---
  - id: cpp-toctou-realpath-toctou
    languages: [c, cpp]
    severity: WARNING
    message: >-
      realpath(path, resolved) resolves symlinks and returns the canonical
      path. However, between realpath() and subsequent open(), the target
      can be replaced (TOCTOU after realpath). Use open() followed by
      fstat() for atomic path resolution.
    metadata:
      category: security
      cwe: "CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition"
      vuln-research-domain: toctou
      confidence: MEDIUM
    patterns:
      - pattern: |
          realpath($PATH, $RESOLVED);
          ...
          open($RESOLVED, ...);


  # --- remove/unlink/rmdir with user path ---
  - id: cpp-env-unlink-user-path
    languages: [c, cpp]
    severity: WARNING
    message: >-
      unlink/remove/rmdir called with a user-controlled path. An attacker
      can delete arbitrary files if the path is not restricted. Validate
      the path is within an expected directory.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      vuln-research-domain: environment
      confidence: MEDIUM
    pattern-either:
