  # --- Android log print ---
  - id: cpp-format-string-android-log-print
    languages: [c, cpp]
    severity: ERROR
    message: >-
      __android_log_print() / __android_log_vprint() with a non-literal
      format string. An attacker-controlled format string can read/write
      arbitrary memory. Always use a constant format string, never pass
      user input as the fmt argument.
    metadata:
      category: security
      cwe: "CWE-134: Use of Externally-Controlled Format String"
      vuln-research-domain: format-string
      confidence: HIGH
    pattern-either:
      - pattern: __android_log_print($PRIO, $TAG, $FMT, ...)
      - pattern: __android_log_vprint($PRIO, $TAG, $FMT, $AP)
    pattern-not-either:
      - pattern: __android_log_print($PRIO, $TAG, "...", ...)
      - pattern: __android_log_vprint($PRIO, $TAG, "...", $AP)


  - id: cpp-format-string-android-assert
    languages: [c, cpp]
    severity: WARNING
    message: >-
      __android_log_assert() with a non-literal format string. This
      terminates the process but may leak memory information first.
    metadata:
