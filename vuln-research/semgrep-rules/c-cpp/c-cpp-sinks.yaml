  # --- std::forward misuse ---
  - id: cpp-semantics-forward-misuse
    languages: [cpp]
    severity: WARNING
    message: >-
      std::forward used outside a forwarding reference context (i.e.,
      not on a T&& template parameter). std::forward on a non-deduced
      type or an rvalue reference produces incorrect value category
      propagation. Only use std::forward with T&& template parameters.
    metadata:
      category: security
      cwe: "CWE-670: Incorrect Implementation"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    patterns:
      - pattern: std::forward<$TYPE>($EXPR)


  # --- string_view of temporary ---
  - id: cpp-semantics-string-view-temporary
    languages: [cpp]
    severity: ERROR
    message: >-
      std::string_view constructed from a temporary string. The temporary
      is destroyed at the end of the expression, leaving the string_view
      dangling. Any subsequent use reads freed memory.
    metadata:
      category: security
      cwe: "CWE-416: Use After Free"
      vuln-research-domain: cpp-semantics
      confidence: HIGH
    patterns:
      - pattern: std::string_view($STR_TEMP)
      - pattern: std::string_view{$STR_TEMP}


  # --- variant get without index check ---
  - id: cpp-semantics-variant-get-without-check
    languages: [cpp]
    severity: ERROR
    message: >-
      std::get<Type>(variant) throws std::bad_variant_access if the
      variant does not hold that type. Always check variant.index()
      or use std::visit() with overloaded lambdas. Unchecked get can
      crash the program.
    metadata:
      category: security
      cwe: "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    pattern: std::get<$TYPE>($VARIANT);


  # --- exception in destructor ---
  - id: cpp-semantics-exception-in-destructor
    languages: [cpp]
    severity: ERROR
    message: >-
      Destructor throws an exception. If the destructor is called during
      stack unwinding (due to another exception), std::terminate is
      invoked immediately. Destructors must be noexcept. Use noexcept
      on all destructors and catch all exceptions inside them.
    metadata:
      category: security
      cwe: "CWE-248: Uncaught Exception"
      vuln-research-domain: cpp-semantics
      confidence: HIGH
    patterns:
      - pattern-inside: |
          ~$CLASS() { ... }
      - pattern: throw $E;


  # --- throw in noexcept ---
  - id: cpp-semantics-throw-in-noexcept
    languages: [cpp]
    severity: ERROR
    message: >-
      Function declared noexcept contains a throw expression. If the
      exception propagates, std::terminate is called. Remove noexcept
      or catch the exception internally.
    metadata:
      category: security
      cwe: "CWE-248: Uncaught Exception"
      vuln-research-domain: cpp-semantics
      confidence: HIGH
    patterns:
      - pattern-inside: |
          $RET $F(...) noexcept { ... }
      - pattern: throw $E;


  # --- regex catastrophic backtracking ---
  - id: cpp-semantics-regex-backtracking
    languages: [cpp]
    severity: WARNING
    message: >-
      std::regex constructed from a user-controlled pattern or applied
      against user-controlled input with nested quantifiers (e.g.,
      (a+)+b). This can cause catastrophic backtracking (ReDoS).
      Avoid user-controlled regex patterns and limit input length.
    metadata:
      category: security
      cwe: "CWE-1333: Inefficient Regular Expression Complexity"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    patterns:
      - pattern: std::regex($PATTERN)
      - pattern: std::regex_match($INPUT, $REGEX)
      - pattern: std::regex_search($INPUT, $REGEX)


  # --- thread detached without synchronization ---
  - id: cpp-semantics-thread-detached-no-sync
    languages: [cpp]
    severity: WARNING
    message: >-
      std::thread detached and the thread accesses shared state without
      synchronization. If the thread outlives the shared state, use-after-
      free results. Use std::jthread (C++20) or ensure proper join/
      synchronization of detached threads.
    metadata:
      category: security
      cwe: "CWE-416: Use After Free"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    patterns:
      - pattern: $THREAD.detach()


  # --- future::get called twice ---
  - id: cpp-semantics-future-get-twice
    languages: [cpp]
    severity: WARNING
    message: >-
      std::future::get() can only be called once. After the first call,
      the future is invalid. Calling get() again throws std::future_error
      or causes undefined behavior. Check valid() before calling get().
    metadata:
      category: security
      cwe: "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: $FUTURE.get()


  # --- launder misuse ---
  - id: cpp-semantics-launder-misuse
    languages: [cpp]
    severity: WARNING
    message: >-
      std::launder is used to access an object through a pointer to
      storage that does not actually contain an object of the claimed
      type. This is nearly always a type-punning or lifetime violation.
      Ensure the storage truly contains a live object of the target type.
    metadata:
      category: security
      cwe: "CWE-704: Incorrect Type Conversion or Cast"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    patterns:
      - pattern: std::launder($PTR)


  # --- mutex lock/unlock without lock_guard ---
  - id: cpp-semantics-mutex-raw-lock-unlock
    languages: [cpp]
    severity: WARNING
    message: >-
      std::mutex::lock() and unlock() called directly without using
      std::lock_guard or std::unique_lock. If an exception is thrown
      between lock and unlock, the mutex is never released, causing
      deadlock. Always use RAII wrappers.
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: |
          $MUTEX.lock();
          ...
          $MUTEX.unlock();


  # --- non-atomic ops on std::atomic ---
  - id: cpp-semantics-non-atomic-on-atomic
    languages: [cpp]
    severity: WARNING
    message: >-
      Non-atomic operations (e.g., loading into a local, then reading
      the local while another thread writes the atomic) on std::atomic
      values defeat the purpose of atomicity. Always use load()/store()
      or the atomic built-in operators consistently.
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    pattern: $ATOMIC.load();


  # --- condition_variable wait without predicate ---
  - id: cpp-semantics-cv-wait-no-predicate
    languages: [cpp]
    severity: WARNING
    message: >-
      std::condition_variable::wait(lock) without a predicate is
      vulnerable to spurious wakeups. The thread may wake up before
      the condition is actually met, proceeding with incorrect state.
      Always use the predicate overload: wait(lock, []{ return ready; }).
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: $CV.wait($LOCK)


  # --- volatile for thread sync ---
  - id: cpp-semantics-volatile-thread-sync
    languages: [cpp]
    severity: WARNING
    message: >-
      volatile keyword used for thread synchronization. volatile does
      NOT provide atomicity or memory ordering guarantees in C++.
      Use std::atomic<T> with the appropriate memory_order instead.
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: volatile $TYPE $VAR;


  # --- shared_ptr refcount race ---
  - id: cpp-semantics-shared-ptr-race
    languages: [cpp]
    severity: WARNING
    message: >-
      std::shared_ptr read and write in different threads without
      synchronization. The control block (refcount) is thread-safe,
      but the pointed-to object is NOT. Concurrent reads and writes
      to the same shared_ptr instance from multiple threads is a
      data race. Use std::atomic<std::shared_ptr> or external locking.
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    pattern: $PTR.use_count();


  # --- async default policy ---
  - id: cpp-semantics-async-default-policy
    languages: [cpp]
    severity: WARNING
    message: >-
      std::async with default launch policy (std::launch::async |
      std::launch::deferred). Whether the function runs asynchronously
      or deferred is implementation-defined. If deferred, the function
      runs when get()/wait() is called, potentially on the wrong thread
      or causing unexpected delays. Specify std::launch::async explicitly.
    metadata:
      category: security
      cwe: "CWE-670: Incorrect Implementation"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    patterns:
      - pattern: std::async($FUNC, ...)
      - pattern-not: std::async(std::launch::async, ...)


  # --- double-checked locking without atomic ---
  - id: cpp-semantics-double-checked-locking
    languages: [cpp]
    severity: WARNING
    message: >-
      Double-checked locking pattern without std::atomic. The non-atomic
      read of the flag outside the lock can observe a torn or stale value,
      causing the object to be partially constructed (data race).
      Use std::atomic for the flag or use std::call_once.
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      vuln-research-domain: cpp-semantics
      confidence: MEDIUM
    patterns:
      - pattern: |
          if (!$FLAG) {
            $LOCK.lock();
            if (!$FLAG) {
              $FLAG = true;
              $RESOURCE = new $TYPE(...);
            }
            $LOCK.unlock();
          }


  # --- memory_order_relaxed for sequential consistency ---
  - id: cpp-semantics-memory-order-relaxed
    languages: [cpp]
    severity: WARNING
    message: >-
      std::memory_order_relaxed used where sequential consistency or
      acquire/release ordering is needed. Relaxed atomics provide no
      ordering guarantees across threads. The compiler and CPU may
      reorder the operation, leading to incorrect multi-threaded
      behavior. Use memory_order_seq_cst unless you can prove relaxed
      is correct.
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      vuln-research-domain: cpp-semantics
      confidence: LOW
    patterns:
      - pattern: memory_order_relaxed


