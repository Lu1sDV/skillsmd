  # ============================================================================
  # §13  ACL MISUSE — Gap Sinks
  # ============================================================================
  #
  # Windows ACL manipulation functions that, if misused, can grant
  # excessive permissions or bypass access controls.
  # ---------------------------------------------------------------------------

  - id: cpp-acl-misuse-addaccessallowedace
    languages: [c, cpp]
    severity: ERROR
    message: >-
      AddAccessAllowedAce() adds an access-allowed ACE to an ACL. The ACE
      is added without inheritance flags by default, potentially granting
      broader access than intended. Use AddAccessAllowedAceEx() with
      explicit inheritance flags and validate the ACL revision.
    metadata:
      category: security
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      vuln-research-domain: acl-misuse
      confidence: MEDIUM
    patterns:
      - pattern: AddAccessAllowedAce($ACL, $REV, $ACCESS, $SID)


  - id: cpp-acl-misuse-setsecuritydescriptordacl
    languages: [c, cpp]
    severity: ERROR
    message: >-
      SetSecurityDescriptorDacl() sets the DACL of a security descriptor.
      If bDaclPresent is TRUE but the ACL pointer is NULL, it grants full
      access to all callers (null DACL). This can unintentionally disable
      access control. Use a non-null ACL with least-privilege entries.
    metadata:
      category: security
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"
      vuln-research-domain: acl-misuse
      confidence: MEDIUM
    patterns:
      - pattern: SetSecurityDescriptorDacl($SD, $PRESENT, $DACL, $DEFAULTED)


