  - id: cpp-privilege-mgmt-rpcimpersonateclient
    languages: [c, cpp]
    severity: ERROR
    message: >-
      RpcImpersonateClient() causes the server thread to impersonate the
      RPC client. If the call fails silently or the impersonation token is
      not reverted, the server runs with incorrect privileges. Always
      check the return value and call RpcRevertToSelf() in a finally
      block.
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      vuln-research-domain: privilege-mgmt
      confidence: MEDIUM
    patterns:
      - pattern: RpcImpersonateClient($BINDING)


  - id: cpp-privilege-mgmt-impersonateloggedonuser
    languages: [c, cpp]
    severity: ERROR
    message: >-
      ImpersonateLoggedOnUser() assigns the thread the security context of
      a logged-on user. Failure to check the return value or to revert
      (RevertToSelf()) can leave the thread with elevated privileges.
    metadata:
      category: security
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      vuln-research-domain: privilege-mgmt
      confidence: MEDIUM
    patterns:
      - pattern: ImpersonateLoggedOnUser($TOKEN)


  - id: cpp-privilege-mgmt-coimpersonateclient
    languages: [c, cpp]
