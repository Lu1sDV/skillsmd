      confidence: MEDIUM
    patterns:
      - pattern: ImpersonateDdeClientWindow($WND, $TOKEN)


  - id: cpp-privilege-mgmt-impersonatesecuritycontext
    languages: [c, cpp]
    severity: ERROR
    message: >-
      ImpersonateSecurityContext() applies a security context to the
      calling thread. If the return value is not checked or
