      category: security
      cwe: "CWE-670: Incorrect Implementation"
      vuln-research-domain: cpp-stl
      confidence: MEDIUM
    patterns:
      - pattern: std::remove($FIRST, $LAST, $VAL)
      - pattern: std::remove_if($FIRST, $LAST, $PRED)


