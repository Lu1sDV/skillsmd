      the behavior is undefined (silent truncation). Use strtol() with
      errno checking or std::from_chars.
    metadata:
      category: security
      cwe: "CWE-190: Integer Overflow or Wraparound"
      vuln-research-domain: integer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: atoi($STR)


  - id: cpp-integer-overflow-atol
    languages: [c, cpp]
    severity: WARNING
    message: >-
