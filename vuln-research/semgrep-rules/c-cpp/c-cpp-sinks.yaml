  # --- strdup / strndup unchecked return ---
  - id: cpp-buffer-overflow-strdup-null-check
    languages: [c, cpp]
    severity: WARNING
    message: >-
      strdup()/strndup() allocate memory internally and return a pointer.
      If allocation fails (OOM), NULL is returned. Dereferencing without
      a NULL check leads to a NULL-pointer dereference. Check the return
      value before using the duplicated string.
    metadata:
      category: security
      cwe: "CWE-476: NULL Pointer Dereference"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: strdup($SRC)
      - pattern-not: |
          if (strdup($SRC) == NULL) ...
      - pattern-not: |
          if (strdup($SRC)) ...
      - pattern-not: |
          if (!strdup($SRC)) ...
      - pattern-not: |
          $BUF = strdup($SRC);
          if ($BUF == NULL) ...
      - pattern-not: |
          $BUF = strdup($SRC);
          if (!$BUF) ...


  - id: cpp-buffer-overflow-strndup-null-check
    languages: [c, cpp]
    severity: WARNING
    message: >-
      strndup() return not checked for NULL after allocation failure.
      Use after NULL leads to undefined behavior.
    metadata:
      category: security
      cwe: "CWE-476: NULL Pointer Dereference"
      vuln-research-domain: buffer-overflow
      confidence: MEDIUM
    patterns:
      - pattern: strndup($SRC, $LEN)
      - pattern-not: |
          if (strndup($SRC, $LEN) == NULL) ...
      - pattern-not: |
          if (!strndup($SRC, $LEN)) ...
      - pattern-not: |
          $BUF = strndup($SRC, $LEN);
          if ($BUF == NULL) ...


