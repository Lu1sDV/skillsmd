rules:
  - id: ruby-auth-session-hardcoded-secret-key-base
    languages: [ruby]
    severity: ERROR
    message: >
      secret_key_base is assigned a hard-coded string literal. This value signs
      and encrypts session cookies; if it leaks (and anything in source control
      has effectively leaked) an attacker can forge signed session and CSRF
      cookies for any user. Load it from credentials or an environment variable,
      never from a literal in code.
    metadata:
      vr-id: RB-SG-1322
      category: auth-session
      cwe: ["CWE-798", "CWE-384"]
      owasp: "A02:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by Rails secret_key_base hardcoding; CWE-798"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/security.html#custom-credentials"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: "$APP.secret_key_base = \"...\""
          - pattern: "config.secret_key_base = \"...\""
          - pattern: "$APP.secrets.secret_key_base = \"...\""
