rules:
  - id: ruby-auth-session-cors-credentials-any-origin
    languages: [ruby]
    severity: ERROR
    message: >
      A rack-cors resource allows any origin ("*") while also enabling
      credentials. Combining a wildcard origin with credentials lets any website
      issue authenticated cross-origin requests and read the responses, exposing
      the victim's session-scoped data. Pin origins to an explicit allowlist
      whenever credentials: true is set.
    metadata:
      vr-id: RB-SG-1318
      category: auth-session
      cwe: ["CWE-942", "CWE-352"]
      owasp: "A05:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by rack-cors credentials-with-wildcard misconfig; CWE-942"
      license: derived-original
      references:
        - "https://github.com/cyu/rack-cors#origin"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: |
          origins "*"
          ...
          resource ..., credentials: true, ...
