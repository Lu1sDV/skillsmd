rules:
  - id: ruby-ldap-injection-search-filter-string-var
    languages: [ruby]
    severity: WARNING
    message: >
      An LDAP search receives its :filter as a plain interpolated String stored
      in a local variable. net-ldap parses a String filter as a raw RFC 2254
      expression rather than a typed Net::LDAP::Filter object, so any request
      data folded into that string can inject filter operators. Build the value
      as a Net::LDAP::Filter object from escaped inputs.
    metadata:
      vr-id: RB-SG-2314
      category: ldap-injection
      cwe: ["CWE-90"]
      owasp: "A03:2021"
      confidence: LOW
      tier: B
      source-citation: "inspired-by net-ldap String-filter coercion sink; CWE-90"
      license: derived-original
      references:
        - "https://www.rubydoc.info/gems/net-ldap/Net/LDAP"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: |
          $Q = "...#{...}..."
          ...
          $LDAP.search(..., filter: $Q, ...)
