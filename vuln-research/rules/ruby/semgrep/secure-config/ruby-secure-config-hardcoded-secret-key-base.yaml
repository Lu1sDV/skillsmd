rules:
  - id: ruby-secure-config-hardcoded-secret-key-base
    languages: [ruby]
    severity: ERROR
    message: >
      secret_key_base is assigned a hardcoded string literal in source, so anyone
      with repository access can forge signed and encrypted cookies, CSRF tokens
      and session data. Load the secret from Rails credentials or an environment
      variable instead of committing it.
    metadata:
      vr-id: RB-SG-2411
      category: secure-config
      cwe: ["CWE-798"]
      owasp: "A05:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by sink catalog hardcoded secret_key_base; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
        - "https://guides.rubyonrails.org/security.html"
    patterns:
      - pattern-either:
          - pattern: $CFG.secret_key_base = "..."
          - pattern: config.secret_key_base = "..."
