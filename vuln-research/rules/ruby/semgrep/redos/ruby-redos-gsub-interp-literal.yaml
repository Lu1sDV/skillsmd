rules:
  - id: ruby-redos-gsub-interp-literal
    languages: [ruby]
    severity: ERROR
    message: >
      String#gsub uses an interpolated regex literal, so a runtime value is spliced into
      the search pattern. When that value originates from request data the attacker writes
      part of the regex and can introduce catastrophic backtracking, hanging the worker
      (ReDoS). Substitute against a fixed literal, or escape the dynamic fragment with
      Regexp.escape before interpolating.
    metadata:
      vr-id: RB-SG-1224
      category: redos
      cwe: ["CWE-1333", "CWE-400"]
      owasp: "A05:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "ruby.md Regex/ReDoS sinks /#{pattern}/ and gsub(regex) combined; CWE-1333"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/String.html#method-i-gsub"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: $S.gsub(/...#{...}.../, ...)
