rules:
  - id: ruby-mail-header-injection-mail-from-params
    languages: [ruby]
    severity: ERROR
    message: >
      The From: address of a mail(...) call is taken directly from request params.
      An attacker controlling this value can spoof the sender, inject extra headers
      via CR/LF, or break SPF/DKIM alignment. Set From: to a fixed, server-owned
      address and never derive it from untrusted input.
    metadata:
      vr-id: RB-SG-1603
      category: mail-header-injection
      cwe: ["CWE-93"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by sink catalog 'mail(from:...)' tainted sender header; CWE-93"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/93.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'mail(..., from: params[...], ...)'
