rules:
  - id: ruby-ssti-tilt-new-param-path
    languages: [ruby]
    severity: ERROR
    message: >
      Tilt selects a template to compile from a request-controlled path. Tilt picks
      an engine by file extension and evaluates the file's contents as code, so an
      attacker controlling the path can point at an arbitrary or uploaded file and
      have it executed as a template (template injection, potential RCE). Resolve
      the template through a server-side allowlist of known files rather than from
      `params`.
    metadata:
      vr-id: RB-SG-0922
      category: ssti
      cwe: ["CWE-1336", "CWE-94"]
      owasp: "A03:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "inspired-by Tilt dynamic-path template class; CWE-1336"
      license: derived-original
      references:
        - "https://github.com/jeremyevans/tilt"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: Tilt.new(params[...])
          - pattern: Tilt.new(params[...]).render(...)
