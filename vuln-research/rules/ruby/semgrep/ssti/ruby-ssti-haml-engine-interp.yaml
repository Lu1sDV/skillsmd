rules:
  - id: ruby-ssti-haml-engine-interp
    languages: [ruby]
    severity: ERROR
    message: >
      A Haml engine is constructed from a template string built with interpolation.
      Haml compiles `= expression` lines to Ruby and evaluates them, so external
      input spliced into the template body can introduce executable Haml/Ruby
      (server-side template injection). Render Haml only from fixed template files
      and pass dynamic values via locals; never build the Haml source from input.
    metadata:
      vr-id: RB-SG-0908
      category: ssti
      cwe: ["CWE-1336", "CWE-94"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by Haml engine template-injection class; CWE-1336"
      license: derived-original
      references:
        - "https://haml.info/"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: Haml::Engine.new("...#{...}...")
          - pattern: Haml::Template.new { "...#{...}..." }
      - pattern-not: Haml::Engine.new("...")
