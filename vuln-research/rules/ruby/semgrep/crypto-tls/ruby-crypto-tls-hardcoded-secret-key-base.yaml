rules:
  - id: ruby-crypto-tls-hardcoded-secret-key-base
    languages: [ruby]
    severity: ERROR
    message: >
      A Rails secret_key_base is assigned from a hardcoded string literal. This
      value derives the keys that sign and encrypt sessions, cookies, and
      MessageVerifier payloads; once it leaks via source control an attacker can
      forge sessions and tamper with signed data. Load it from Rails encrypted
      credentials or an environment variable instead.
    metadata:
      vr-id: RB-SG-1426
      category: crypto-tls
      cwe: ["CWE-798", "CWE-321"]
      owasp: "A02:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by sink catalog hardcoded secret_key_base; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: $APP.secret_key_base = "..."
          - pattern: "$CFG.secret_key_base = \"...\""
