rules:
  - id: ruby-deserialization-oj-compat-load
    languages: [ruby]
    severity: WARNING
    message: >
      Oj.load in mode: :compat emulates other JSON libraries and, depending on
      options, can still instantiate objects via additions when parsing
      attacker-controlled input. For untrusted data prefer mode: :strict, which
      returns only plain hashes, arrays, and primitives.
    metadata:
      vr-id: RB-SG-0418
      category: deserialization
      cwe: ["CWE-502"]
      owasp: "A08:2021"
      confidence: LOW
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md Oj.compat_load; CWE-502"
      license: derived-original
      references:
        - "https://github.com/ohler55/oj/blob/develop/pages/modes.md"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: "Oj.load($X, ..., mode: :compat, ...)"
