rules:
  - id: ruby-mass-assignment-create-params
    languages: [ruby]
    severity: ERROR
    message: >
      Model.create is called with an unfiltered params slice, persisting a row
      whose columns are dictated entirely by the request body. An attacker can
      seed privileged columns (role, verified_at, balance) at creation time. Pass
      a whitelisted hash from params.require(:record).permit(:title, :body) instead
      of the raw params key.
    metadata:
      vr-id: RB-SG-1102
      category: mass-assignment
      cwe: ["CWE-915"]
      owasp: "A08:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by codeql rb/insecure-mass-assignment; CWE-915"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/action_controller_overview.html#strong-parameters"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: $M.create(params[$K])
          - pattern: $M.create(params[$K], ...)
      - pattern-not: $M.create(params.require(...).permit(...), ...)
      - pattern-not: $M.create(params.require(...).permit(...))
