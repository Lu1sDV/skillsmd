rules:
  - id: ruby-mass-assignment-to-unsafe-hash
    languages: [ruby]
    severity: ERROR
    message: >
      params.to_unsafe_hash (the older alias of to_unsafe_h) returns the entire
      request hash without strong-parameters filtering. Any subsequent model
      assignment from it allows arbitrary columns to be set. Replace with an
      explicit permit allow-list.
    metadata:
      vr-id: RB-SG-1115
      category: mass-assignment
      cwe: ["CWE-915"]
      owasp: "A08:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by sinks/ruby.md to_unsafe_hash strong-params bypass; CWE-915"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActionController/Parameters.html#method-i-to_unsafe_h"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: $P.to_unsafe_hash
