rules:
  - id: ruby-path-traversal-file-binwrite
    languages: [ruby]
    severity: ERROR
    message: >
      File.binwrite writes raw bytes to a path built from external input. An attacker
      using "../" can overwrite executables, configuration, or web-root files with
      attacker-chosen bytes, which may lead to remote code execution. Validate the
      destination against an allow list and confirm File.expand_path keeps it inside a
      trusted directory before writing.
    metadata:
      vr-id: RB-SG-0608
      category: path-traversal
      cwe: ["CWE-22"]
      owasp: "A01:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by codeql rb/path-injection; CWE-22"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/File.html#method-c-binwrite"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: File.binwrite(params[...], ...)
          - pattern: File.binwrite("...#{params[...]}...", ...)
