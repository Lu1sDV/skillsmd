rules:
  - id: ruby-insecure-randomness-array-shuffle-password
    languages: [ruby]
    severity: WARNING
    message: >
      A password or token is assembled with Array#shuffle, which permutes elements
      using the non-cryptographic default PRNG. The resulting ordering is
      predictable from the generator state. Supply a CSPRNG via
      shuffle(random: SecureRandom), or generate the secret with SecureRandom directly.
    metadata:
      vr-id: RB-SG-2209
      category: insecure-randomness
      cwe: ["CWE-338"]
      owasp: "A02:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "re-expressed from Array#shuffle secret-builder idiom; CWE-338"
      license: derived-original
      references:
        - "https://ruby-doc.org/core/Array.html#method-i-shuffle"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: $CHARS.shuffle.first($N).join
          - pattern: $CHARS.shuffle[0...$N].join
          - pattern: $CHARS.shuffle.take($N).join
      - pattern-not: "$CHARS.shuffle(random: $R).first($N).join"
