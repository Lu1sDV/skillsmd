rules:
  - id: ruby-job-injection-sidekiq-client-push-dynamic-class
    languages: [ruby]
    severity: ERROR
    message: >
      Sidekiq::Client.push is called with a worker class taken straight from
      request parameters. Because Sidekiq instantiates and runs whatever class
      name it is handed, attacker-controlled job classes let an attacker invoke
      any worker with arbitrary arguments. Restrict the class to a server-side
      allow-list and never derive it from params.
    metadata:
      vr-id: RB-SG-1702
      category: job-injection
      cwe: ["CWE-94"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md Sidekiq::Client.push(class: params[:class]); CWE-94"
      license: derived-original
      references:
        - "https://github.com/sidekiq/sidekiq/wiki/The-Basics"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'Sidekiq::Client.push("class" => params[...], ...)'
          - pattern: 'Sidekiq::Client.push(class: params[...], ...)'
          - pattern: 'Sidekiq::Client.new.push(class: params[...], ...)'
