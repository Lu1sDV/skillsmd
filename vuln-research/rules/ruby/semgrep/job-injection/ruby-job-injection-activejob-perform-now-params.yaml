rules:
  - id: ruby-job-injection-activejob-perform-now-params
    languages: [ruby]
    severity: WARNING
    message: >
      Request parameters are executed inline through an ActiveJob perform_now
      call. Running the job synchronously with raw params still pushes unvalidated
      structure into the job body where it can reach SQL, file, or shell sinks,
      and it does so in the request thread without queue-level safeguards.
      Validate and reduce input to scalar identifiers before invoking the job.
    metadata:
      vr-id: RB-SG-1719
      category: job-injection
      cwe: ["CWE-502"]
      owasp: "A08:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "inspired-by sinks/ruby.md ActiveJob.perform raw params; CWE-502"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/active_job_basics.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: $J.perform_now(params)
          - pattern: $J.perform_now(params.to_h, ...)
          - pattern: $J.new(params).perform_now
