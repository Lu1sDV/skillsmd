rules:
  - id: ruby-job-injection-activejob-set-wait-until-tainted
    languages: [ruby]
    severity: WARNING
    message: >
      The scheduled execution time for an ActiveJob is parsed from request input
      and passed to set(wait_until:). A client-controlled timestamp lets an
      attacker schedule work arbitrarily far in the future or in the past to evade
      rate windows and ordering assumptions, and a malformed value can be a
      denial-of-service vector. Compute the run time server-side from trusted data.
    metadata:
      vr-id: RB-SG-1728
      category: job-injection
      cwe: ["CWE-94"]
      owasp: "A04:2021"
      confidence: LOW
      tier: B
      source-citation: "inspired-by sinks/ruby.md ActiveJob set(...) scheduling from input; CWE-94"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/active_job_basics.html#enqueue-the-job"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: '$J.set(wait_until: Time.parse(params[...])).perform_later(...)'
          - pattern: '$J.set(wait: params[...]).perform_later(...)'
          - pattern: '$J.set(wait_until: params[...]).perform_later(...)'
