rules:
  - id: ruby-command-injection-open3-popen2e
    languages: [ruby]
    severity: ERROR
    message: >
      Open3.popen2e runs an interpolated command string with stdout and stderr merged.
      The single-string form goes through a shell, so external input interpolated into it
      allows shell metacharacter injection and arbitrary command execution. Use the
      argument-vector form `Open3.popen2e("cmd", arg)` to avoid the shell.
    metadata:
      vr-id: RB-SG-0109
      category: command-injection
      cwe: ["CWE-78"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by codeql frameworks/stdlib/Open3.qll (popen2e sink); CWE-78"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/Open3.html#method-c-popen2e"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: Open3.popen2e("...#{...}...")
      - pattern-not: Open3.popen2e("...", ...)
