rules:
  - id: ruby-command-injection-open3-capture3
    languages: [ruby]
    severity: ERROR
    message: >
      Open3.capture3 runs an interpolated command string and returns stdout, stderr and
      the exit status. The single-string form is parsed by the shell, so interpolating
      external input enables shell metacharacter injection and arbitrary command
      execution. Pass the command and arguments separately — `Open3.capture3("cmd", arg)`.
    metadata:
      vr-id: RB-SG-0113
      category: command-injection
      cwe: ["CWE-78"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by codeql frameworks/stdlib/Open3.qll (capture3 sink); CWE-78"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/Open3.html#method-c-capture3"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: Open3.capture3("...#{...}...")
      - pattern-not: Open3.capture3("...", ...)
