rules:
  - id: ruby-command-injection-open3-capture2e
    languages: [ruby]
    severity: ERROR
    message: >
      Open3.capture2e runs an interpolated command string and returns stdout and stderr
      merged. The string form is shell-parsed, so attacker-controlled interpolated input
      allows shell metacharacter injection and arbitrary command execution. Use the
      argument-vector form `Open3.capture2e("cmd", arg)` so no shell is involved.
    metadata:
      vr-id: RB-SG-0112
      category: command-injection
      cwe: ["CWE-78"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by codeql frameworks/stdlib/Open3.qll (capture2e sink); CWE-78"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/Open3.html#method-c-capture2e"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: Open3.capture2e("...#{...}...")
      - pattern-not: Open3.capture2e("...", ...)
