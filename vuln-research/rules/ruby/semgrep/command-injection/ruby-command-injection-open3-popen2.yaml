rules:
  - id: ruby-command-injection-open3-popen2
    languages: [ruby]
    severity: ERROR
    message: >
      Open3.popen2 is given an interpolated command string. The string form is parsed by
      the shell, so interpolating attacker-controlled input enables shell metacharacter
      injection and arbitrary command execution. Pass the command and each argument
      separately — `Open3.popen2("cmd", arg)` — so Open3 spawns without a shell.
    metadata:
      vr-id: RB-SG-0108
      category: command-injection
      cwe: ["CWE-78"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by codeql frameworks/stdlib/Open3.qll (popen2 sink); CWE-78"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/Open3.html#method-c-popen2"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: Open3.popen2("...#{...}...")
      - pattern-not: Open3.popen2("...", ...)
