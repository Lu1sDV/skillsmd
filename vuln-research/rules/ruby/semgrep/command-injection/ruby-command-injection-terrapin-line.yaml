rules:
  - id: ruby-command-injection-terrapin-line
    languages: [ruby]
    severity: ERROR
    message: >
      Terrapin::CommandLine is built with an interpolated command template. Interpolating
      attacker-controlled input directly into the template defeats Terrapin's
      interpolation-placeholder escaping, letting an attacker inject shell metacharacters
      and run arbitrary commands. Keep the template static and pass dynamic values through
      named :placeholders so Terrapin escapes them.
    metadata:
      vr-id: RB-SG-0125
      category: command-injection
      cwe: ["CWE-78"]
      owasp: "A03:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "catalog-derived: Terrapin::CommandLine wrapper (ruby.md OS command execution); CWE-78"
      license: derived-original
      references:
        - "https://github.com/thoughtbot/terrapin"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: Terrapin::CommandLine.new("...#{...}...", ...)
