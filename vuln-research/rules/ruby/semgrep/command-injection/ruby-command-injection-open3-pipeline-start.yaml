rules:
  - id: ruby-command-injection-open3-pipeline-start
    languages: [ruby]
    severity: ERROR
    message: >
      Open3.pipeline_start launches a pipeline asynchronously with an interpolated string
      stage. The string stage is shell-parsed, so attacker-controlled interpolation
      permits injecting additional commands into the running pipeline. Pass each stage as
      an argument array to keep the shell out of the path.
    metadata:
      vr-id: RB-SG-0115
      category: command-injection
      cwe: ["CWE-78"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by codeql frameworks/stdlib/Open3.qll (pipeline_start sink); CWE-78"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/Open3.html#method-c-pipeline_start"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: Open3.pipeline_start(..., "...#{...}...", ...)
          - pattern: Open3.pipeline_start("...#{...}...", ...)
