rules:
  - id: ruby-hardcoded-secrets-db-config-password
    languages: [ruby]
    severity: ERROR
    message: >
      A database connection password is supplied as a string literal to
      establish_connection. Hardcoded database credentials end up in version
      control and grant anyone with source access direct database reach. Source
      the password from ENV or Rails encrypted credentials instead of inlining it.
    metadata:
      vr-id: RB-SG-2101
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md establish_connection password literal; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'ActiveRecord::Base.establish_connection(..., password: "...", ...)'
          - pattern: '$X.establish_connection(..., password: "...", ...)'
      - pattern-not: '$X.establish_connection(..., password: ENV[...], ...)'
