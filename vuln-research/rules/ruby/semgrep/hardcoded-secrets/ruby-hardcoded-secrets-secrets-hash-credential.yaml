rules:
  - id: ruby-hardcoded-secrets-secrets-hash-credential
    languages: [ruby]
    severity: WARNING
    message: >
      A credential-named local variable is assigned a string literal. Hardcoding a
      password, api_key, or token in source commits it to version control where it
      can be harvested. Read the value from ENV or Rails encrypted credentials and
      remove the literal from source.
    metadata:
      vr-id: RB-SG-2132
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "catalog-derived from CodeQL rb/hardcoded-credentials maybeCredentialName; credential-named assignment to literal; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: '$NAME = "..."'
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i)^(.*_)?(password|passwd|api_key|apikey|secret_key|access_token|auth_token|client_secret)$'
      - metavariable-regex:
          metavariable: $NAME
          regex: '^[a-z_][a-zA-Z0-9_]*$'
