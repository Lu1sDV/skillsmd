rules:
  - id: ruby-hardcoded-secrets-mailgun-sendgrid-api-key
    languages: [ruby]
    severity: ERROR
    message: >
      A SendGrid API key literal (SG. prefix) is embedded in source. A committed
      mail-provider key lets an attacker send mail as your domain and read sending
      stats. Load the key from ENV or a secrets manager and rotate any value that
      was committed.
    metadata:
      vr-id: RB-SG-2131
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; SendGrid SG. API key format; CWE-798"
      license: derived-original
      references:
        - "https://docs.sendgrid.com/for-developers/sending-email/api-getting-started"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '"SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}"'
