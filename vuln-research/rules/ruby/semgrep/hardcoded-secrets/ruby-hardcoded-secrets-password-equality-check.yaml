rules:
  - id: ruby-hardcoded-secrets-password-equality-check
    languages: [ruby]
    severity: ERROR
    message: >
      User-supplied input is compared against a hardcoded password or token using
      ==. Beyond embedding the secret in source, plain == is non-constant-time and
      leaks length/prefix via timing. Compare a value sourced from credentials
      using ActiveSupport::SecurityUtils.secure_compare instead.
    metadata:
      vr-id: RB-SG-2121
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "catalog-derived from CodeQL rb/hardcoded-credentials credentialComparison; equality check against literal secret; CWE-798"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActiveSupport/SecurityUtils.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'params[...] == "..."'
          - pattern: 'request.headers[...] == "..."'
          - pattern: '$PASSWORD == "..."'
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: '(?i).*(password|passwd|token|secret|api_key).*'
