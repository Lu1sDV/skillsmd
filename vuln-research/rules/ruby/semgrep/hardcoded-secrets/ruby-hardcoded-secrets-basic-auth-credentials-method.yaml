rules:
  - id: ruby-hardcoded-secrets-basic-auth-credentials-method
    languages: [ruby]
    severity: ERROR
    message: >
      http_basic_authenticate_with is configured with literal name and password
      values. The committed credentials guard a controller and are visible to
      anyone with source access. Source the name and password from Rails
      credentials or ENV instead of inlining them in the class body.
    metadata:
      vr-id: RB-SG-2126
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md security-sensitive configuration; http_basic_authenticate_with name:/password: literal; CWE-798"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActionController/HttpAuthentication/Basic.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'http_basic_authenticate_with name: "...", password: "...", ...'
      - pattern-not: 'http_basic_authenticate_with name: ENV[...], password: ENV[...], ...'
