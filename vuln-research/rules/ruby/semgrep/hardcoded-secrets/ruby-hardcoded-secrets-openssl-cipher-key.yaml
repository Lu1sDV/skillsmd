rules:
  - id: ruby-hardcoded-secrets-openssl-cipher-key
    languages: [ruby]
    severity: ERROR
    message: >
      An OpenSSL::Cipher key or iv is assigned a string literal. A hardcoded
      symmetric key means every ciphertext is decryptable by anyone with source
      access, and a static iv defeats semantic security. Derive keys from a KDF over
      a secret stored in ENV or a secrets manager, and use a random iv per message.
    metadata:
      vr-id: RB-SG-2118
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md security-sensitive configuration; OpenSSL::Cipher key=/iv= literal; CWE-798"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/OpenSSL/Cipher.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: '$C.key = "..."'
          - pattern: '$C.iv = "..."'
      - pattern-inside: |
          $C = OpenSSL::Cipher.new(...)
          ...
