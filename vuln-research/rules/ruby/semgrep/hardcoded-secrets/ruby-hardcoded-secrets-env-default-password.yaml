rules:
  - id: ruby-hardcoded-secrets-env-default-password
    languages: [ruby]
    severity: ERROR
    message: >
      An ENV lookup for a secret falls back to a hardcoded default literal via the
      `||` or fetch default. When the variable is unset in any environment the app
      silently runs with a known, committed secret. Fail loudly on a missing secret
      instead of defaulting to an inlined value.
    metadata:
      vr-id: RB-SG-2113
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; ENV fallback default; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'ENV[$K] || "..."'
          - pattern: 'ENV.fetch($K, "...")'
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)"[^"]*(secret|password|api_key|token|passwd)[^"]*"'
