rules:
  - id: ruby-hardcoded-secrets-rails-secret-key-base
    languages: [ruby]
    severity: ERROR
    message: >
      secret_key_base is assigned a string literal. This master secret derives the
      keys that sign and encrypt sessions and cookies; leaking it lets an attacker
      forge sessions and tamper with signed data. Read it from Rails encrypted
      credentials or ENV, never from inline source.
    metadata:
      vr-id: RB-SG-2105
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md secrets.yml/credentials hardcoded; Rails secret_key_base; CWE-798"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/security.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: '$X.secret_key_base = "..."'
          - pattern: 'config.secret_key_base = "..."'
      - pattern-not: '$X.secret_key_base = ENV[...]'
