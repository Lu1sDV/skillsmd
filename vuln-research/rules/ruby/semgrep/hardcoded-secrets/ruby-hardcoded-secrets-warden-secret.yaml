rules:
  - id: ruby-hardcoded-secrets-warden-secret
    languages: [ruby]
    severity: ERROR
    message: >
      A pepper or cookie-signing secret is assigned a string literal in
      configuration. The committed pepper feeds password hashing or cookie signing,
      so its exposure weakens those protections for every user. Source the pepper
      from Rails credentials or ENV rather than inlining it.
    metadata:
      vr-id: RB-SG-2130
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md security-sensitive configuration; config.pepper / secret literal; CWE-798"
      license: derived-original
      references:
        - "https://github.com/heartcombo/devise"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'config.pepper = "..."'
      - pattern-not: 'config.pepper = ENV[...]'
