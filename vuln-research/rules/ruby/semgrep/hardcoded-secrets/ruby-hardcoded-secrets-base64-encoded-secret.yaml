rules:
  - id: ruby-hardcoded-secrets-base64-encoded-secret
    languages: [ruby]
    severity: WARNING
    message: >
      A secret-named variable is assigned a Base64-decoded string literal. Base64 is
      encoding, not encryption, so the decoded secret is trivially recoverable from
      source and offers no protection. Load the raw secret from ENV or a secrets
      manager rather than committing an encoded copy.
    metadata:
      vr-id: RB-SG-2129
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Base64-encoded secret literal masquerade; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'Base64.decode64("...")'
          - pattern: 'Base64.strict_decode64("...")'
