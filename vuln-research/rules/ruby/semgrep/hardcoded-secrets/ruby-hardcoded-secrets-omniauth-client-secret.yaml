rules:
  - id: ruby-hardcoded-secrets-omniauth-client-secret
    languages: [ruby]
    severity: ERROR
    message: >
      An OAuth provider client secret is passed to the OmniAuth provider as a
      string literal. A leaked client secret lets attackers impersonate your
      application against the identity provider. Read provider credentials from
      Rails credentials or ENV instead of inlining them.
    metadata:
      vr-id: RB-SG-2107
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md initializer secret hardcoded; OmniAuth provider client secret; CWE-798"
      license: derived-original
      references:
        - "https://github.com/omniauth/omniauth"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'provider $NAME, "...", "..."'
      - pattern-not: 'provider $NAME, ENV[...], ENV[...]'
