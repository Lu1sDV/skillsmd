rules:
  - id: ruby-hardcoded-secrets-redis-url-credentials
    languages: [ruby]
    severity: ERROR
    message: >
      A Redis connection URL containing inline credentials is hardcoded when
      constructing the client. The embedded password is committed to source and
      grants direct access to cached sessions and queued jobs. Build the URL from
      an ENV variable rather than inlining the userinfo component.
    metadata:
      vr-id: RB-SG-2110
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; redis:// URL with userinfo; CWE-798"
      license: derived-original
      references:
        - "https://github.com/redis/redis-rb"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '"redis://[^:"/]+:[^@"/]+@'
