rules:
  - id: ruby-hardcoded-secrets-twilio-auth-token
    languages: [ruby]
    severity: ERROR
    message: >
      A Twilio account SID and auth token are passed to the REST client as string
      literals. The committed auth token lets an attacker send messages and place
      calls billed to your account. Read the SID and token from ENV or encrypted
      credentials rather than inlining them.
    metadata:
      vr-id: RB-SG-2114
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Twilio::REST::Client SID/token; CWE-798"
      license: derived-original
      references:
        - "https://www.twilio.com/docs/libraries/ruby"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'Twilio::REST::Client.new("...", "...")'
      - pattern-not: 'Twilio::REST::Client.new(ENV[...], ENV[...])'
