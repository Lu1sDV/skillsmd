rules:
  - id: ruby-hardcoded-secrets-aws-access-key-id
    languages: [ruby]
    severity: ERROR
    message: >
      An AWS access key id literal (AKIA-prefixed) is assigned in source. Committed
      AWS keys are routinely harvested from repositories and lead to account
      takeover and resource abuse. Use an IAM role, instance profile, or ENV-sourced
      credentials instead of embedding the key.
    metadata:
      vr-id: RB-SG-2103
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; AWS AKIA key format; CWE-798"
      license: derived-original
      references:
        - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '"AKIA[0-9A-Z]{16}"'
