rules:
  - id: ruby-hardcoded-secrets-faraday-basic-auth
    languages: [ruby]
    severity: ERROR
    message: >
      A Faraday connection sets HTTP basic auth with literal credentials. The
      hardcoded secret is committed to source and applied to every request the
      connection makes. Read the username and password from ENV or a secrets
      manager rather than embedding them in code.
    metadata:
      vr-id: RB-SG-2112
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Faraday request :basic_auth; CWE-798"
      license: derived-original
      references:
        - "https://lostisland.github.io/faraday/"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: '$CONN.basic_auth("...", "...")'
          - pattern: '$CONN.request :basic_auth, "...", "..."'
      - pattern-not: '$CONN.basic_auth(ENV[...], ENV[...])'
