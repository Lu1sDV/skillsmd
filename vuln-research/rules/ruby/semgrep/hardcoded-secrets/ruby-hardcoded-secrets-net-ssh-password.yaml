rules:
  - id: ruby-hardcoded-secrets-net-ssh-password
    languages: [ruby]
    severity: ERROR
    message: >
      Net::SSH.start is invoked with a literal password. The committed SSH password
      grants shell access to the target host to anyone reading the source. Use
      key-based authentication or a password sourced from ENV or a secrets manager
      rather than inlining it.
    metadata:
      vr-id: RB-SG-2122
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Net::SSH.start password: literal; CWE-798"
      license: derived-original
      references:
        - "https://net-ssh.github.io/net-ssh/"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'Net::SSH.start($HOST, $USER, ..., password: "...", ...)'
      - pattern-not: 'Net::SSH.start($HOST, $USER, ..., password: ENV[...], ...)'
