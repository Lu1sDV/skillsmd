rules:
  - id: ruby-hardcoded-secrets-mongoid-uri-credentials
    languages: [ruby]
    severity: ERROR
    message: >
      A MongoDB connection URI with embedded userinfo credentials is hardcoded.
      The committed username and password grant direct database access to anyone
      with source. Construct the URI from an ENV variable instead of inlining the
      credentials.
    metadata:
      vr-id: RB-SG-2124
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; mongodb:// URI with userinfo; CWE-798"
      license: derived-original
      references:
        - "https://www.mongodb.com/docs/ruby-driver/current/"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '"mongodb(\+srv)?://[^:"/]+:[^@"/]+@'
