rules:
  - id: ruby-hardcoded-secrets-private-key-pem
    languages: [ruby]
    severity: ERROR
    message: >
      A PEM-encoded private key block is embedded directly in a Ruby string. A
      committed private key compromises every signature and TLS session that relies
      on it. Load key material from a file outside the repo, a secrets manager, or
      ENV, and rotate any key that was committed.
    metadata:
      vr-id: RB-SG-2117
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; inline PEM PRIVATE KEY block; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
