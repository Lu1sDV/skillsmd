rules:
  - id: ruby-hardcoded-secrets-smtp-password
    languages: [ruby]
    severity: ERROR
    message: >
      An SMTP password is provided to Action Mailer smtp_settings as a string
      literal. Committed mail credentials let an attacker send mail as your domain
      and abuse your sending reputation. Source the password from ENV or encrypted
      credentials instead of hardcoding it.
    metadata:
      vr-id: RB-SG-2109
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md initializer secret hardcoded; ActionMailer smtp_settings password; CWE-798"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/action_mailer_basics.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: '$X.smtp_settings = {..., password: "...", ...}'
          - pattern: 'config.action_mailer.smtp_settings = {..., password: "...", ...}'
      - pattern-not: '$X.smtp_settings = {..., password: ENV[...], ...}'
