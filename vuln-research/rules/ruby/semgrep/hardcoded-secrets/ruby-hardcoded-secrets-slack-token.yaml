rules:
  - id: ruby-hardcoded-secrets-slack-token
    languages: [ruby]
    severity: ERROR
    message: >
      A Slack API token literal (xoxb / xoxp / xoxa prefix) is embedded in source.
      A committed Slack token grants the bot or user's full workspace scope to
      anyone with repo access. Load the token from ENV or a secrets store and
      rotate any value that was committed.
    metadata:
      vr-id: RB-SG-2116
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Slack xoxb/xoxp token format; CWE-798"
      license: derived-original
      references:
        - "https://api.slack.com/authentication/token-types"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '"xox[baprs]-[0-9A-Za-z-]{10,}"'
