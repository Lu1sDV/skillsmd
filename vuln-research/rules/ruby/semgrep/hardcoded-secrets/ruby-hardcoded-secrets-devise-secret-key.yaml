rules:
  - id: ruby-hardcoded-secrets-devise-secret-key
    languages: [ruby]
    severity: ERROR
    message: >
      Devise's secret_key is set to a string literal in the initializer. This key
      signs password-reset and confirmation tokens; exposing it lets an attacker
      mint valid tokens and hijack accounts. Source it from Rails credentials or
      ENV rather than committing the literal.
    metadata:
      vr-id: RB-SG-2106
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md initializer secret hardcoded; Devise config.secret_key; CWE-798"
      license: derived-original
      references:
        - "https://github.com/heartcombo/devise"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'config.secret_key = "..."'
      - pattern-not: 'config.secret_key = ENV[...]'
