rules:
  - id: ruby-hardcoded-secrets-octokit-access-token
    languages: [ruby]
    severity: ERROR
    message: >
      Octokit::Client is constructed with an access_token string literal. A
      committed GitHub access token grants API access to the associated account or
      app. Read the token from ENV or a secrets manager and revoke any value that
      reached source control.
    metadata:
      vr-id: RB-SG-2125
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Octokit::Client access_token literal; CWE-798"
      license: derived-original
      references:
        - "https://github.com/octokit/octokit.rb"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: 'Octokit::Client.new(..., access_token: "...", ...)'
      - pattern-not: 'Octokit::Client.new(..., access_token: ENV[...], ...)'
