rules:
  - id: ruby-hardcoded-secrets-stripe-api-key
    languages: [ruby]
    severity: ERROR
    message: >
      A Stripe live secret API key (sk_live_) is assigned to Stripe.api_key as a
      string literal. A committed live key allows charges, refunds, and customer
      data access on your account. Load the key from ENV or encrypted credentials.
    metadata:
      vr-id: RB-SG-2108
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Stripe sk_live key; CWE-798"
      license: derived-original
      references:
        - "https://stripe.com/docs/keys"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'Stripe.api_key = "..."'
          - pattern-regex: '"sk_live_[0-9a-zA-Z]{16,}"'
      - pattern-not: 'Stripe.api_key = ENV[...]'
