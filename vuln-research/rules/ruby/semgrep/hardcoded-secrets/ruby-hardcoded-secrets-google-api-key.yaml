rules:
  - id: ruby-hardcoded-secrets-google-api-key
    languages: [ruby]
    severity: ERROR
    message: >
      A Google API key literal (AIza-prefixed) is embedded in source. A committed
      Google API key can be abused to run up billing on the associated project and
      access enabled APIs. Restrict the key and load it from ENV or a secrets store
      rather than inlining it.
    metadata:
      vr-id: RB-SG-2120
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Google AIza API key format; CWE-798"
      license: derived-original
      references:
        - "https://cloud.google.com/docs/authentication/api-keys"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '"AIza[0-9A-Za-z_-]{35}"'
