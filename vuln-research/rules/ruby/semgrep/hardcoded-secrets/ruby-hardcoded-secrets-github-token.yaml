rules:
  - id: ruby-hardcoded-secrets-github-token
    languages: [ruby]
    severity: ERROR
    message: >
      A GitHub personal access token literal (ghp_ / gho_ / github_pat_) appears in
      source. Committed GitHub tokens are scanned for and abused to access private
      repositories and CI. Store the token in ENV or a secrets manager and revoke
      any value that reached version control.
    metadata:
      vr-id: RB-SG-2115
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; GitHub PAT token format; CWE-798"
      license: derived-original
      references:
        - "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-regex: '"(ghp_|gho_|ghs_|github_pat_)[0-9A-Za-z_]{20,}"'
