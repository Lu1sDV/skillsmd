rules:
  - id: ruby-hardcoded-secrets-httparty-basic-auth
    languages: [ruby]
    severity: ERROR
    message: >
      An HTTParty request passes basic_auth with literal username and password in
      the options hash. The committed credentials are sent on every call and exposed
      to anyone with source access. Source the username and password from ENV or a
      secrets manager rather than inlining them.
    metadata:
      vr-id: RB-SG-2128
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; HTTParty basic_auth option literal; CWE-798"
      license: derived-original
      references:
        - "https://github.com/jnunemaker/httparty"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: '$M(..., basic_auth: {username: "...", password: "..."}, ...)'
      - pattern-not: '$M(..., basic_auth: {username: ENV[...], password: ENV[...]}, ...)'
