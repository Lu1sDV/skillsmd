rules:
  - id: ruby-hardcoded-secrets-aws-secret-access-key
    languages: [ruby]
    severity: ERROR
    message: >
      An AWS secret access key is passed as a string literal to the SDK credentials
      constructor. The paired secret grants full programmatic access to AWS
      resources and must never live in source. Supply credentials via an IAM role
      or ENV variables consumed by Aws::Credentials.
    metadata:
      vr-id: RB-SG-2104
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; aws-sdk Aws::Credentials; CWE-798"
      license: derived-original
      references:
        - "https://docs.aws.amazon.com/sdk-for-ruby/v3/api/Aws/Credentials.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'Aws::Credentials.new("...", "...", ...)'
          - pattern: 'Aws::Credentials.new(ENV[...], "...", ...)'
      - pattern-not: 'Aws::Credentials.new(ENV[...], ENV[...], ...)'
