rules:
  - id: ruby-hardcoded-secrets-net-http-basic-auth
    languages: [ruby]
    severity: ERROR
    message: >
      Net::HTTP basic_auth is called with a literal username and password. The
      hardcoded credentials are committed to source and reused for every request
      to the upstream service. Pass credentials sourced from ENV or a secrets
      store instead of inlining them.
    metadata:
      vr-id: RB-SG-2111
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Net::HTTP request.basic_auth; CWE-798"
      license: derived-original
      references:
        - "https://docs.ruby-lang.org/en/master/Net/HTTPHeader.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: '$REQ.basic_auth("...", "...")'
      - pattern-not: '$REQ.basic_auth(ENV[...], ENV[...])'
