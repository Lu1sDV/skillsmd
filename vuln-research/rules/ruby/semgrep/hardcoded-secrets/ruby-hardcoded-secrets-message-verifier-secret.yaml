rules:
  - id: ruby-hardcoded-secrets-message-verifier-secret
    languages: [ruby]
    severity: ERROR
    message: >
      ActiveSupport::MessageVerifier or MessageEncryptor is constructed with a
      literal secret. A committed signing/encryption secret lets an attacker forge
      or decrypt signed payloads such as tokens and remember-me cookies. Pass a
      secret derived from Rails credentials or ENV instead of inlining it.
    metadata:
      vr-id: RB-SG-2119
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md security-sensitive configuration; ActiveSupport::MessageVerifier/MessageEncryptor literal secret; CWE-798"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActiveSupport/MessageVerifier.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'ActiveSupport::MessageVerifier.new("...", ...)'
          - pattern: 'ActiveSupport::MessageEncryptor.new("...", ...)'
      - pattern-not: 'ActiveSupport::MessageVerifier.new(ENV[...], ...)'
      - pattern-not: 'ActiveSupport::MessageEncryptor.new(ENV[...], ...)'
