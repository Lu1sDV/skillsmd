rules:
  - id: ruby-hardcoded-secrets-sidekiq-redis-password
    languages: [ruby]
    severity: ERROR
    message: >
      Sidekiq is configured with a Redis connection hash that hardcodes the
      password. The committed Redis password exposes queued jobs and any data they
      carry to anyone with source access. Read the password or full URL from ENV
      instead of inlining it in the configure block.
    metadata:
      vr-id: RB-SG-2127
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; Sidekiq redis password literal; CWE-798"
      license: derived-original
      references:
        - "https://github.com/sidekiq/sidekiq/wiki/Using-Redis"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern: '$CONFIG.redis = {..., password: "...", ...}'
      - pattern-not: '$CONFIG.redis = {..., password: ENV[...], ...}'
