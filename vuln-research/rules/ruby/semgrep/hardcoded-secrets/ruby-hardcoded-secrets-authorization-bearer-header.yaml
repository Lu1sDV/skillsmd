rules:
  - id: ruby-hardcoded-secrets-authorization-bearer-header
    languages: [ruby]
    severity: ERROR
    message: >
      An Authorization header is set to a string literal containing a Bearer token
      or Basic credential. The committed token is reused for every outbound request
      and is exposed to anyone with source access. Build the header from a token
      sourced from ENV or a secrets store rather than inlining it.
    metadata:
      vr-id: RB-SG-2123
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md committed secret leakage; literal Authorization Bearer/Basic header; CWE-798"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/798.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern-regex: '"Authorization"\s*=>\s*"(Bearer|Basic) [^"#]+"'
          - pattern-regex: '"Bearer [A-Za-z0-9._-]{12,}"'
