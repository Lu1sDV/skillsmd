rules:
  - id: ruby-hardcoded-secrets-jwt-secret
    languages: [ruby]
    severity: ERROR
    message: >
      A JWT signing secret is passed to JWT.encode/JWT.decode as a string literal.
      Anyone reading the source can forge or verify tokens, fully defeating token
      integrity. Load the HMAC secret from Rails credentials or ENV, never inline it.
    metadata:
      vr-id: RB-SG-2102
      category: hardcoded-secrets
      cwe: ["CWE-798"]
      owasp: "A07:2021"
      confidence: HIGH
      tier: B
      source-citation: "catalog-derived from references/sinks/ruby.md JWT signing-secret literal; ruby-jwt; CWE-798"
      license: derived-original
      references:
        - "https://github.com/jwt/ruby-jwt"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: 'JWT.encode($PAYLOAD, "...", ...)'
          - pattern: 'JWT.decode($TOKEN, "...", ...)'
      - pattern-not: 'JWT.encode($PAYLOAD, ENV[...], ...)'
      - pattern-not: 'JWT.decode($TOKEN, ENV[...], ...)'
