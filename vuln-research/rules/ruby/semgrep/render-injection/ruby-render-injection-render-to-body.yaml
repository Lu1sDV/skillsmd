rules:
  - id: ruby-render-injection-render-to-body
    languages: [ruby]
    severity: ERROR
    message: >
      render_to_body resolves a template from request input. The produced body may
      be reused in responses or downstream output, so an attacker-chosen template
      name can disclose unintended view content. Render a fixed template name and
      provide data through assigns or locals.
    metadata:
      vr-id: RB-SG-1925
      category: render-injection
      cwe: ["CWE-22", "CWE-98"]
      owasp: "A03:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "inspired-by sinks/ruby.md dynamic render paths; render_to_body variant; CWE-98"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActionController/Rendering.html#method-i-render_to_body"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: render_to_body(params[...])
          - pattern: "render_to_body(template: params[...])"
          - pattern: "render_to_body(partial: params[...])"
