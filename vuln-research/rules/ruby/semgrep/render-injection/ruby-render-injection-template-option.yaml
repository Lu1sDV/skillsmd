rules:
  - id: ruby-render-injection-template-option
    languages: [ruby]
    severity: ERROR
    message: >
      render template: receives an attacker-controlled parameter. The template
      lookup is driven by user input, allowing selection of arbitrary application
      templates and information disclosure. Map the input to a known template
      through an explicit allow-list before rendering.
    metadata:
      vr-id: RB-SG-1902
      category: render-injection
      cwe: ["CWE-22", "CWE-98"]
      owasp: "A03:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by sinks/ruby.md 'render template: params[:template]'; CWE-22"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/layouts_and_rendering.html#rendering-an-arbitrary-file"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: "render(template: params[...])"
          - pattern: "render template: params[...]"
          - pattern: "render(template: params[...], ...)"
          - pattern: "render template: params[...], ..."
