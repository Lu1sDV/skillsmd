rules:
  - id: ruby-rails-misc-logger-password
    languages: [ruby]
    severity: ERROR
    message: >
      A secret value (password, token, secret, or API key) is written to the Rails
      logger. Application logs are widely readable and long-lived, so logging
      credentials in cleartext exposes them to anyone with log access. Remove the
      secret from the log line and rely on filter_parameters for any incidental
      capture.
    metadata:
      vr-id: RB-SG-2514
      category: rails-misc
      cwe: ["CWE-200"]
      owasp: "A09:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "inspired-by CodeQL rb/cleartext-logging CleartextLogging; CWE-200"
      license: derived-original
      references:
        - "https://cwe.mitre.org/data/definitions/532.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: "Rails.logger.$LEVEL(\"...#{$X.password}...\")"
          - pattern: "Rails.logger.$LEVEL(\"...#{params[:password]}...\")"
          - pattern: "Rails.logger.$LEVEL(\"...#{$X.api_key}...\")"
          - pattern: "logger.$LEVEL(\"...#{params[:password]}...\")"
