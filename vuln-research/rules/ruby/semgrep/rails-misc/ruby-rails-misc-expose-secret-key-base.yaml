rules:
  - id: ruby-rails-misc-expose-secret-key-base
    languages: [ruby]
    severity: ERROR
    message: >
      secret_key_base (or another credential) is rendered or logged. This value signs
      sessions and message verifiers; disclosing it lets an attacker forge signed
      cookies and tampered tokens (critical secret exposure). Never serialize the
      secret key base into a response or log line.
    metadata:
      vr-id: RB-SG-2523
      category: rails-misc
      cwe: ["CWE-200"]
      owasp: "A02:2021"
      confidence: HIGH
      tier: B
      source-citation: "inspired-by secret_key_base/credentials disclosure sink; CWE-200"
      license: derived-original
      references:
        - "https://guides.rubyonrails.org/security.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: "render(plain: Rails.application.secret_key_base, ...)"
          - pattern: "render(plain: Rails.application.secret_key_base)"
          - pattern: "render(json: Rails.application.credentials.config, ...)"
          - pattern: "Rails.logger.$LEVEL(Rails.application.secret_key_base)"
