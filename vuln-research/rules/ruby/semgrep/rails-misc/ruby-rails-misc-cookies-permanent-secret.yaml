rules:
  - id: ruby-rails-misc-cookies-permanent-secret
    languages: [ruby]
    severity: WARNING
    message: >
      A sensitive value is stored in an unsigned, unencrypted permanent cookie. The
      client can read and tamper with the value, and it persists for years, expanding
      the disclosure window (sensitive data in a plain cookie). Use cookies.encrypted
      or session storage and avoid permanent lifetimes for secrets.
    metadata:
      vr-id: RB-SG-2525
      category: rails-misc
      cwe: ["CWE-200"]
      owasp: "A02:2021"
      confidence: LOW
      tier: B
      source-citation: "inspired-by cookies.permanent plaintext sensitive value sink; CWE-200"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActionDispatch/Cookies.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: "cookies.permanent[:auth_token] = ..."
          - pattern: "cookies.permanent[:api_key] = ..."
          - pattern: "cookies[:auth_token] = $V"
      - pattern-not: "cookies.encrypted[...] = ..."
      - pattern-not: "cookies.signed[...] = ..."
