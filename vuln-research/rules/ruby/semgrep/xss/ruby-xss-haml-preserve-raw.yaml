rules:
  - id: ruby-xss-haml-preserve-raw
    languages: [ruby]
    severity: WARNING
    message: >
      Haml's `find_and_preserve` / `preserve` helpers are wrapping a `raw` or
      `html_safe` value, so whitespace-preserved content is emitted without escaping.
      When that content comes from request data, the attacker controls the rendered
      markup, causing cross-site scripting. Preserve the escaped value instead of a
      raw one, or sanitize the fragment before preserving it.
    metadata:
      vr-id: RB-SG-0825
      category: xss
      cwe: ["CWE-79"]
      owasp: "A03:2021"
      confidence: LOW
      tier: B
      source-citation: "inspired-by Haml preserve/find_and_preserve raw content; CWE-79"
      license: derived-original
      references:
        - "https://haml.info/docs/yardoc/Haml/Helpers.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: preserve(raw(...))
          - pattern: find_and_preserve(raw(...))
          - pattern: preserve(params[...].html_safe)
