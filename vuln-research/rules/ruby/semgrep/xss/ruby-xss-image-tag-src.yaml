rules:
  - id: ruby-xss-image-tag-src
    languages: [ruby]
    severity: WARNING
    message: >
      `image_tag` builds an `<img>` whose src comes directly from request input. An
      attacker-controlled value can supply a `javascript:`/`data:` URL or inject an
      `onerror` handler, producing cross-site scripting in browsers that evaluate it.
      Restrict the source to a validated host/path allow-list, or store and serve the
      asset yourself rather than echoing a client-supplied URL.
    metadata:
      vr-id: RB-SG-0822
      category: xss
      cwe: ["CWE-79"]
      owasp: "A03:2021"
      confidence: LOW
      tier: B
      source-citation: "inspired-by Rails image_tag attacker-controlled src; CWE-79"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActionView/Helpers/AssetTagHelper.html#method-i-image_tag"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: image_tag(params[...])
          - pattern: image_tag(params[...], ...)
