rules:
  - id: ruby-xxe-xmlmini-parse
    languages: [ruby]
    severity: WARNING
    message: >
      ActiveSupport::XmlMini.parse is invoked on attacker-controlled XML.
      XmlMini delegates to the selected backend (REXML, Nokogiri, LibXML, or
      JDOM); several backends process DOCTYPE entities, exposing
      entity-expansion denial of service and, with the SAX/LibXML backends,
      external-entity handling. Do not parse untrusted XML through XmlMini, or
      pin a backend configured to disable DTD/entity processing.
    metadata:
      vr-id: RB-SG-1511
      category: xxe
      cwe: ["CWE-611", "CWE-776"]
      owasp: "A05:2021"
      confidence: MEDIUM
      tier: B
      source-citation: "inspired-by ruby.md 'ActiveSupport::XmlMini.parse' sink; CWE-776"
      license: derived-original
      references:
        - "https://api.rubyonrails.org/classes/ActiveSupport/XmlMini.html"
      validated:
        parses: true
        tested: true
    patterns:
      - pattern-either:
          - pattern: ActiveSupport::XmlMini.parse(params[...])
          - pattern: ActiveSupport::XmlMini.parse(request.body.read)
          - pattern: ActiveSupport::XmlMini.parse(request.raw_post)
          - pattern: ActiveSupport::XmlMini.parse($IO.read)
