name: Pinned harness smoke

on:
  push:
    paths:
      - 'skillsmd/**'
      - '.github/workflows/harness-pinned-smoke.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m unittest discover -s skillsmd/tests -v
      - run: python3 skillsmd/tools/build_skills.py --check

  pin-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: export
        run: echo "matrix=$(python3 skillsmd/tools/check_harnesses.py --ci-matrix)" >> "$GITHUB_OUTPUT"

  cli-smoke:
    needs: pin-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pin-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - uses: oven-sh/setup-bun@v2
        if: matrix.target == 'omp'
        with: {bun-version: '1.4.4'}
      - name: Install EXACT pinned harness version
        run: npm install -g "${{ matrix.package }}@${{ matrix.version }}"
      - name: Check installed version equals pin
        run: python3 skillsmd/tools/check_harnesses.py --target "${{ matrix.target }}" --strict
      - name: Install project review resources without user configuration changes
        run: |
          mkdir -p "$RUNNER_TEMP/review-sandbox"
          python3 skillsmd/install.py install --target "${{ matrix.target }}" --scope project --project-root "$RUNNER_TEMP/review-sandbox" --with-reviewer
          python3 skillsmd/install.py upgrade --target "${{ matrix.target }}" --scope project --project-root "$RUNNER_TEMP/review-sandbox" --with-reviewer
      - name: Check command/skill discovery files
        run: python3 skillsmd/tools/validate_layout.py --target "${{ matrix.target }}" --scope project --project-root "$RUNNER_TEMP/review-sandbox"

# This workflow tests pinned CLI startup/version and installed path shape only.
# Live interactive command invocation, authentication, and subagent orchestration
# require separate credentialed/manual integration testing and are NOT certified here.
